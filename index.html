<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Euronews Italia Live</title>

    <!-- HLS.JS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;
        }


        body {
            position: fixed;

            top: 0;
            left: 0;

            right: 0;
            bottom: 0;
        }


        #video {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            background: #000;

            display: block;

            object-fit: contain;

            object-position: center center;

            border: 0;

        }


        /*
         * Nessun messaggio visibile sullo schermo.
         * Serve solamente per eventuale gestione interna.
         */

        #status {

            position: fixed;

            top: 0;
            left: 0;

            width: 1px;
            height: 1px;

            opacity: 0;

            pointer-events: none;

        }

    </style>

</head>


<body>


    <video
        id="video"
        autoplay
        playsinline
        webkit-playsinline
        preload="auto">
    </video>


    <div id="status"></div>


<script>


/*
============================================================
EURONEWS ITALIA LIVE
============================================================
*/


const STREAM_URL =
"https://cdn-euronews.akamaized.net/live/europe/europenews-it/25805/index.m3u8";


const video =
document.getElementById("video");


let hls = null;

let reconnectTimer = null;

let reconnecting = false;

let started = false;


/*
============================================================
VIDEO SETTINGS
============================================================
*/


video.autoplay = true;

video.controls = false;

video.playsInline = true;

video.preload = "auto";


/*
============================================================
AUDIO
============================================================

NON impostiamo muted=true.

Il player tenterà quindi di partire
direttamente con audio.

Se OptiSigns/WebView permette
l'autoplay con audio -> parte automaticamente.

*/


video.muted = false;

video.defaultMuted = false;


/*
============================================================
PLAY AUTOMATICO
============================================================
*/


function startPlayback() {

    console.log("Tentativo avvio video + audio");


    const promise = video.play();


    if (promise !== undefined) {

        promise.then(function () {

            console.log(
                "EURONEWS AVVIATO AUTOMATICAMENTE CON AUDIO"
            );

            started = true;

        }).catch(function (error) {

            console.log(
                "Autoplay con audio bloccato dal browser/WebView:",
                error
            );


            /*
             * NON mostriamo nessun messaggio.
             *
             * Continuiamo comunque a lasciare
             * il video pronto.
             */

            started = false;

        });

    }

}


/*
============================================================
DISTRUGGE HLS
============================================================
*/


function destroyHLS() {

    if (hls !== null) {

        try {

            hls.destroy();

        } catch (error) {

            console.log(
                "Errore destroy HLS:",
                error
            );

        }

        hls = null;

    }

}


/*
============================================================
RICONNESSIONE
============================================================
*/


function reconnect() {

    if (reconnecting) {

        return;

    }


    reconnecting = true;


    console.log(
        "Riconnessione Euronews..."
    );


    clearTimeout(reconnectTimer);


    reconnectTimer = setTimeout(

        function () {

            reconnecting = false;

            startStream();

        },

        3000

    );

}


/*
============================================================
AVVIO STREAM
============================================================
*/


function startStream() {


    destroyHLS();


    console.log(
        "Caricamento stream Euronews..."
    );


    /*
    ========================================================
    HLS.JS
    ========================================================
    */


    if (Hls.isSupported()) {


        hls = new Hls({

            /*
             * Qualità automatica.
             */

            startLevel: -1,


            /*
             * Adatta la qualità alle dimensioni
             * dello schermo.
             */

            capLevelToPlayerSize: true,


            /*
             * Buffer abbastanza piccolo
             * per partire rapidamente.
             */

            maxBufferLength: 10,

            maxMaxBufferLength: 20,


            /*
             * Mantiene il live vicino
             * alla diretta.
             */

            liveSyncDurationCount: 3,

            liveMaxLatencyDurationCount: 6,


            /*
             * Buffer precedente limitato.
             */

            backBufferLength: 20,


            /*
             * Recupero errori rete.
             */

            manifestLoadingMaxRetry: 5,

            manifestLoadingRetryDelay: 1000,


            levelLoadingMaxRetry: 5,

            levelLoadingRetryDelay: 1000,


            fragLoadingMaxRetry: 5,

            fragLoadingRetryDelay: 1000,


            /*
             * Worker HLS.
             */

            enableWorker: true,


            /*
             * Modalità live.
             */

            lowLatencyMode: true

        });


        /*
         * Carica lo stream.
         */

        hls.loadSource(STREAM_URL);


        /*
         * Collega HLS al video.
         */

        hls.attachMedia(video);


        /*
        ====================================================
        MANIFEST CARICATO
        ====================================================
        */


        hls.on(

            Hls.Events.MANIFEST_PARSED,

            function (event, data) {


                console.log(
                    "Manifest Euronews caricato."
                );


                console.log(
                    "Qualità disponibili:",
                    data.levels.length
                );


                /*
                 * Mostra in console le qualità disponibili.
                 */

                data.levels.forEach(

                    function (level, index) {

                        console.log(

                            "Livello",
                            index,
                            ":",
                            level.width +
                            "x" +
                            level.height,
                            "bitrate:",
                            level.bitrate

                        );

                    }

                );


                /*
                 * AVVIO AUTOMATICO
                 */

                startPlayback();

            }

        );


        /*
        ====================================================
        ERRORI HLS
        ====================================================
        */


        hls.on(

            Hls.Events.ERROR,

            function (event, data) {


                console.log(
                    "HLS:",
                    data
                );


                /*
                 * Errore non fatale:
                 * HLS prova a recuperare.
                 */

                if (!data.fatal) {

                    return;

                }


                /*
                 * ERRORE DI RETE
                 */

                if (

                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR

                ) {


                    console.log(
                        "Errore rete. Tentativo recupero..."
                    );


                    try {

                        hls.startLoad();

                    } catch (error) {

                        reconnect();

                    }


                    return;

                }


                /*
                 * ERRORE VIDEO
                 */

                if (

                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR

                ) {


                    console.log(
                        "Errore video. Recupero..."
                    );


                    try {

                        hls.recoverMediaError();

                    } catch (error) {

                        reconnect();

                    }


                    return;

                }


                /*
                 * ERRORE FATALE
                 */

                reconnect();

            }

        );


    }


    /*
    ========================================================
    HLS NATIVO
    ========================================================
    */


    else if (

        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )

    ) {


        console.log(
            "Utilizzo HLS nativo."
        );


        video.src = STREAM_URL;


        video.addEventListener(

            "loadedmetadata",

            function () {

                startPlayback();

            },

            {
                once: true
            }

        );


        video.addEventListener(

            "error",

            function () {

                reconnect();

            }

        );

    }


    else {


        console.log(
            "HLS non supportato."
        );

    }

}


/*
============================================================
VIDEO IN RIPRODUZIONE
============================================================
*/


video.addEventListener(

    "playing",

    function () {

        console.log(
            "EURONEWS LIVE"
        );

        started = true;

    }

);


/*
============================================================
BUFFERING
============================================================
*/


video.addEventListener(

    "waiting",

    function () {

        console.log(
            "Buffering..."
        );

    }

);


/*
============================================================
STREAM BLOCCATO
============================================================
*/


video.addEventListener(

    "stalled",

    function () {


        console.log(
            "Stream stalled..."
        );


        setTimeout(

            function () {

                if (
                    video.readyState < 3
                ) {

                    reconnect();

                }

            },

            5000

        );

    }

);


/*
============================================================
ERRORE VIDEO
============================================================
*/


video.addEventListener(

    "error",

    function () {

        console.log(
            "Errore video."
        );

        reconnect();

    }

);


/*
============================================================
VISIBILITY CHANGE
============================================================

Se OptiSigns sospende temporaneamente
la pagina e poi la riporta in primo piano,
proviamo nuovamente il play.

============================================================
*/


document.addEventListener(

    "visibilitychange",

    function () {

        if (
            document.visibilityState ===
            "visible"
        ) {


            if (
                video.paused
            ) {

                startPlayback();

            }

        }

    }

);


/*
============================================================
FOCUS
============================================================
*/


window.addEventListener(

    "focus",

    function () {

        if (video.paused) {

            startPlayback();

        }

    }

);


/*
============================================================
 AVVIO INIZIALE
============================================================
*/


window.addEventListener(

    "load",

    function () {

        console.log(
            "Pagina caricata."
        );


        startStream();

    }

);


/*
============================================================
ULTERIORE TENTATIVO AUTOMATICO
============================================================

Alcuni WebView applicano la policy audio
dopo il primo caricamento.

Facciamo alcuni tentativi automatici,
senza mostrare nulla a video.

============================================================
*/


setTimeout(

    function () {

        if (video.paused) {

            startPlayback();

        }

    },

    1500

);


setTimeout(

    function () {

        if (video.paused) {

            startPlayback();

        }

    },

    4000

);


setTimeout(

    function () {

        if (video.paused) {

            startPlayback();

        }

    },

    8000

);


</script>


</body>

</html>
