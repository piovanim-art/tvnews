<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TVNews - Euronews Italia Live</title>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

        }


        body {

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /*
         * CONTENITORE VIDEO 16:9
         */

        #player {

            position: relative;

            width: 100vw;

            height: 56.25vw;

            max-width: 100vw;

            max-height: 100vh;

            background: #000;

            overflow: hidden;

        }


        /*
         * QUANDO LO SCHERMO È PIÙ LARGO DEL 16:9
         */

        @media (min-aspect-ratio: 16/9) {

            #player {

                width: 177.77777778vh;

                height: 100vh;

            }

        }


        /*
         * VIDEO
         */

        #video {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: block;

            background: #000;

            /*
             * Mantiene il formato originale
             */

            object-fit: contain;

        }


        /*
         * MESSAGGIO DI STATO
         */

        #status {

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 22px;

            text-align: center;

            background: rgba(0, 0, 0, 0.75);

            padding: 15px 25px;

            border-radius: 8px;

            z-index: 20;

        }

    </style>

</head>


<body>


    <div id="player">


        <video

            id="video"

            autoplay

            muted

            playsinline

            preload="auto">

        </video>


        <div id="status">

            Connessione a Euronews...

        </div>


    </div>



    <!--

        HLS.JS

    -->

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>



    <script>


        /*
         * ELEMENTI
         */

        const video =
            document.getElementById("video");

        const status =
            document.getElementById("status");



        /*
         * STREAM EURONEWS ITALIANO
         *
         * SORGENTE PRINCIPALE WURL
         */

        const STREAM_URL =

            "https://acb6ca89.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmxheHhUVi1ldV9FdXJvbmV3c0l0YWxpYW5vX0hMUw/playlist.m3u8";



        /*
         * MOSTRA MESSAGGIO
         */

        function showStatus(text) {

            status.textContent = text;

            status.style.display = "block";

        }



        /*
         * NASCONDE MESSAGGIO
         */

        function hideStatus() {

            status.style.display = "none";

        }



        /*
         * PLAY
         */

        function playVideo() {

            video.play().catch(function(error) {

                console.log(
                    "Autoplay non disponibile:",
                    error
                );

            });

        }



        /*
         * AVVIO STREAM
         */

        function startStream() {


            showStatus(
                "Connessione a Euronews..."
            );



            /*
             * HLS NATIVO
             *
             * Safari / alcuni dispositivi
             */

            if (
                video.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            ) {


                console.log(
                    "Utilizzo HLS nativo"
                );


                video.src = STREAM_URL;


                video.addEventListener(

                    "loadedmetadata",

                    function() {

                        hideStatus();

                        playVideo();

                    },

                    { once: true }

                );


                video.addEventListener(

                    "error",

                    function() {

                        console.log(
                            "Errore video"
                        );

                        reconnectNative();

                    }

                );

            }



            /*
             * HLS.JS
             */

            else if (
                Hls.isSupported()
            ) {


                console.log(
                    "Utilizzo HLS.js"
                );


                const hls =
                    new Hls({

                        /*
                         * Mantiene il player
                         * vicino alla diretta
                         */

                        liveSyncDurationCount: 3,

                        liveMaxLatencyDurationCount: 6,

                        /*
                         * Worker
                         */

                        enableWorker: true,

                        /*
                         * Bassa latenza
                         */

                        lowLatencyMode: true,

                        /*
                         * Buffer
                         */

                        backBufferLength: 30,

                        /*
                         * Retry
                         */

                        manifestLoadingMaxRetry: 6,

                        levelLoadingMaxRetry: 6,

                        fragLoadingMaxRetry: 6

                    });



                /*
                 * CARICA STREAM
                 */

                hls.loadSource(
                    STREAM_URL
                );



                /*
                 * COLLEGA AL VIDEO
                 */

                hls.attachMedia(
                    video
                );



                /*
                 * MANIFEST PRONTO
                 */

                hls.on(

                    Hls.Events.MANIFEST_PARSED,

                    function() {


                        console.log(
                            "Manifest Euronews caricato"
                        );


                        hideStatus();


                        playVideo();

                    }

                );



                /*
                 * VIDEO IN RIPRODUZIONE
                 */

                video.addEventListener(

                    "playing",

                    function() {

                        console.log(
                            "Euronews in riproduzione"
                        );

                        hideStatus();

                    }

                );



                /*
                 * VIDEO BLOCCATO
                 */

                video.addEventListener(

                    "stalled",

                    function() {

                        console.log(
                            "Stream bloccato"
                        );

                        showStatus(
                            "Riconnessione..."
                        );

                    }

                );



                /*
                 * WAITING
                 */

                video.addEventListener(

                    "waiting",

                    function() {

                        console.log(
                            "Buffering..."
                        );

                    }

                );



                /*
                 * ERRORI HLS
                 */

                hls.on(

                    Hls.Events.ERROR,

                    function(
                        event,
                        data
                    ) {


                        console.log(
                            "HLS error:",
                            data
                        );



                        /*
                         * ERRORE NON FATALE
                         */

                        if (!data.fatal) {

                            return;

                        }



                        /*
                         * ERRORE DI RETE
                         */

                        if (

                            data.type ===
                            Hls.ErrorTypes.NETWORK_ERROR

                        ) {


                            console.log(
                                "Errore rete - riconnessione"
                            );


                            showStatus(
                                "Riconnessione..."
                            );


                            setTimeout(

                                function() {

                                    hls.startLoad();

                                },

                                3000

                            );


                        }



                        /*
                         * ERRORE MEDIA
                         */

                        else if (

                            data.type ===
                            Hls.ErrorTypes.MEDIA_ERROR

                        ) {


                            console.log(
                                "Errore media - recupero"
                            );


                            hls.recoverMediaError();

                        }



                        /*
                         * ERRORE FATALE
                         */

                        else {


                            console.log(
                                "Errore HLS fatale"
                            );


                            showStatus(
                                "Riconnessione..."
                            );


                            hls.destroy();


                            setTimeout(

                                function() {

                                    startStream();

                                },

                                5000

                            );

                        }

                    }

                );

            }



            /*
             * HLS NON SUPPORTATO
             */

            else {


                showStatus(

                    "Questo dispositivo non supporta lo streaming HLS."

                );

            }

        }



        /*
         * RICONNESSIONE HLS NATIVO
         */

        function reconnectNative() {


            showStatus(
                "Riconnessione..."
            );


            setTimeout(

                function() {


                    video.pause();


                    video.removeAttribute(
                        "src"
                    );


                    video.load();


                    video.src =
                        STREAM_URL;


                    video.load();


                    playVideo();


                },

                3000

            );

        }



        /*
         * CONTROLLO PERIODICO
         *
         * Se il video si ferma,
         * prova automaticamente a ripartire.
         */

        setInterval(

            function() {


                if (

                    video.paused &&
                    video.readyState >= 2

                ) {


                    console.log(
                        "Video fermo - riavvio"
                    );


                    playVideo();

                }


            },

            10000

        );



        /*
         * AVVIO
         */

        startStream();


    </script>


</body>

</html>
