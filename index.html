<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TVNews - Euronews Italia Live</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #video {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            background: #000;

            display: block;
        }

        #status {
            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-family: Arial, sans-serif;
            font-size: 22px;

            text-align: center;

            display: block;

            z-index: 10;

            background: rgba(0, 0, 0, 0.65);

            padding: 18px 25px;

            border-radius: 8px;
        }

    </style>
</head>


<body>

    <video
        id="video"
        autoplay
        playsinline
        preload="auto"
        controls="false">
    </video>

    <div id="status">
        Connessione a Euronews...
    </div>


    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


    <script>

        const video = document.getElementById("video");
        const status = document.getElementById("status");


        /*
         * STREAM EURONEWS ITALIA
         */
        const STREAM_URL =
            "https://cdn-euronews.akamaized.net/live/eds/euronews-it/25085/index.m3u8";


        /*
         * MOSTRA STATO
         */
        function showStatus(text) {

            status.textContent = text;
            status.style.display = "block";

        }


        /*
         * NASCONDI STATO
         */
        function hideStatus() {

            status.style.display = "none";

        }


        /*
         * AVVIO STREAM
         */
        function startStream() {

            /*
             * SUPPORTO HLS NATIVO
             *
             * Safari / alcuni dispositivi
             */
            if (video.canPlayType("application/vnd.apple.mpegurl")) {

                video.src = STREAM_URL;

                video.addEventListener(
                    "loadedmetadata",
                    function () {

                        hideStatus();

                        startVideo();

                    },
                    { once: true }
                );

            }


            /*
             * HLS.JS
             *
             * Chrome / Edge / Android / OptiSigns
             */
            else if (Hls.isSupported()) {

                const hls = new Hls({

                    /*
                     * PARTENZA VELOCE
                     */
                    startLevel: -1,

                    /*
                     * BUFFER NON ECCESSIVO
                     * per evitare ritardi inutili
                     */
                    maxBufferLength: 12,

                    maxMaxBufferLength: 20,

                    /*
                     * RECUPERO AUTOMATICO
                     */
                    enableWorker: true,

                    /*
                     * BASSA LATENZA
                     */
                    lowLatencyMode: true,

                    /*
                     * RECUPERO ERRORI
                     */
                    backBufferLength: 30

                });


                hls.loadSource(STREAM_URL);

                hls.attachMedia(video);


                /*
                 * STREAM PRONTO
                 */
                hls.on(
                    Hls.Events.MANIFEST_PARSED,
                    function () {

                        hideStatus();

                        startVideo();

                    }
                );


                /*
                 * ERRORI HLS
                 */
                hls.on(
                    Hls.Events.ERROR,
                    function (event, data) {

                        console.log("HLS error:", data);


                        if (data.fatal) {

                            showStatus("Riconnessione...");


                            switch (data.type) {

                                case Hls.ErrorTypes.NETWORK_ERROR:

                                    hls.startLoad();

                                    break;


                                case Hls.ErrorTypes.MEDIA_ERROR:

                                    hls.recoverMediaError();

                                    break;


                                default:

                                    hls.destroy();

                                    setTimeout(
                                        startStream,
                                        3000
                                    );

                                    break;

                            }

                        }

                    }
                );

            }


            /*
             * NESSUN SUPPORTO HLS
             */
            else {

                showStatus(
                    "Questo dispositivo non supporta lo streaming HLS."
                );

            }

        }


        /*
         * AVVIO VIDEO
         *
         * IMPORTANTE:
         * NON usiamo muted.
         */
        function startVideo() {

            video.volume = 1.0;


            const playPromise = video.play();


            if (playPromise !== undefined) {

                playPromise
                    .then(function () {

                        hideStatus();

                        console.log(
                            "Euronews avviato con audio."
                        );

                    })
                    .catch(function (error) {

                        console.log(
                            "Autoplay con audio bloccato:",
                            error
                        );


                        /*
                         * Il browser/dispositivo ha
                         * bloccato l'autoplay con audio.
                         *
                         * Lasciamo comunque il video pronto.
                         */
                        showStatus(
                            "Premere play per attivare l'audio"
                        );

                    });

            }

        }


        /*
         * VIDEO IN RIPRODUZIONE
         */
        video.addEventListener(
            "playing",
            function () {

                hideStatus();

            }
        );


        /*
         * VIDEO IN ATTESA
         */
        video.addEventListener(
            "waiting",
            function () {

                showStatus("Caricamento...");

            }
        );


        /*
         * VIDEO BLOCCATO
         */
        video.addEventListener(
            "stalled",
            function () {

                showStatus("Riconnessione...");

            }
        );


        /*
         * ERRORE VIDEO
         */
        video.addEventListener(
            "error",
            function () {

                showStatus("Riconnessione...");

                setTimeout(
                    startStream,
                    5000
                );

            }
        );


        /*
         * SE IL VIDEO SI FERMA
         */
        video.addEventListener(
            "pause",
            function () {

                /*
                 * Evita pause accidentali.
                 */
                setTimeout(
                    function () {

                        if (video.paused) {

                            startVideo();

                        }

                    },
                    1000
                );

            }
        );


        /*
         * AVVIO AUTOMATICO
         */
        startStream();


    </script>

</body>

</html>
