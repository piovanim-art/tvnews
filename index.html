<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>EuroNews Live</title>

<style>

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
}

body {
  position: fixed;
  inset: 0;
}

#video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  display: block;

  background: #000;

  object-fit: contain;

  border: 0;
  outline: 0;
}

</style>

</head>

<body>

<video
  id="video"
  autoplay
  muted
  playsinline
  webkit-playsinline
  preload="auto"
  disablepictureinpicture
  controlslist="nodownload noplaybackrate nofullscreen"
></video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

<script>

const STREAM_URL =
"https://acb6ca89.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmxheHhUVi1ldV9FdVJvbmV3c0l0YWxpYW5vX0hMUw/playlist.m3u8";

const video = document.getElementById("video");

let hls = null;
let retryTimer = null;


/* AUDIO OFF */

video.muted = true;
video.volume = 0;


/* PLAY */

function playVideo() {

  video.muted = true;
  video.volume = 0;

  const p = video.play();

  if (p) {

    p.catch(() => {

      setTimeout(() => {

        video.muted = true;

        video.play().catch(() => {});

      }, 1000);

    });

  }

}


/* DESTROY HLS */

function destroyHLS() {

  if (hls) {

    try {
      hls.destroy();
    } catch (e) {}

    hls = null;

  }

}


/* RETRY */

function reconnect() {

  if (retryTimer) {
    return;
  }

  retryTimer = setTimeout(() => {

    retryTimer = null;

    startStream();

  }, 3000);

}


/* HLS */

function startHLS() {

  destroyHLS();

  hls = new Hls({

    enableWorker: true,

    startLevel: -1,

    capLevelToPlayerSize: true,

    maxBufferLength: 10,

    maxMaxBufferLength: 20,

    backBufferLength: 10,

    maxBufferHole: 0.5,

    fragLoadingMaxRetry: 5,

    manifestLoadingMaxRetry: 5,

    levelLoadingMaxRetry: 5,

    fragLoadingRetryDelay: 1000,

    manifestLoadingRetryDelay: 1000,

    levelLoadingRetryDelay: 1000,

    fragLoadingTimeOut: 10000,

    manifestLoadingTimeOut: 10000,

    levelLoadingTimeOut: 10000

  });


  hls.attachMedia(video);


  hls.on(
    Hls.Events.MEDIA_ATTACHED,
    () => {

      hls.loadSource(STREAM_URL);

    }
  );


  hls.on(
    Hls.Events.MANIFEST_PARSED,
    () => {

      playVideo();

    }
  );


  hls.on(
    Hls.Events.ERROR,
    (event, data) => {

      if (!data.fatal) {
        return;
      }

      if (
        data.type === Hls.ErrorTypes.NETWORK_ERROR
      ) {

        try {

          hls.startLoad();

        } catch (e) {

          reconnect();

        }

      }

      else if (
        data.type === Hls.ErrorTypes.MEDIA_ERROR
      ) {

        try {

          hls.recoverMediaError();

        } catch (e) {

          reconnect();

        }

      }

      else {

        reconnect();

      }

    }
  );

}


/* START */

function startStream() {

  destroyHLS();

  video.removeAttribute("src");

  /*
    HLS NATIVO
  */

  if (
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src = STREAM_URL;

    video.addEventListener(
      "loadedmetadata",
      function startNative() {

        playVideo();

        video.removeEventListener(
          "loadedmetadata",
          startNative
        );

      }
    );

    return;

  }


  /*
    HLS.JS
  */

  if (
    window.Hls &&
    Hls.isSupported()
  ) {

    startHLS();

    return;

  }


  reconnect();

}


/* STALLED */

video.addEventListener(
  "stalled",
  () => {

    setTimeout(() => {

      if (
        video.paused ||
        video.readyState < 3
      ) {

        reconnect();

      }

    }, 5000);

  }
);


/* ENDED */

video.addEventListener(
  "ended",
  () => {

    reconnect();

  }
);


/* ERROR */

video.addEventListener(
  "error",
  () => {

    reconnect();

  }
);


/* CONTROLLO */

setInterval(() => {

  video.muted = true;
  video.volume = 0;

  if (
    video.paused &&
    video.readyState >= 2
  ) {

    playVideo();

  }

}, 5000);


/* AVVIO */

startStream();

</script>

</body>

</html>
