<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>EuroNews Live</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      background: #000;

      object-fit: cover;

      border: 0;
      outline: 0;
    }
  </style>
</head>

<body>

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate nofullscreen"
  ></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

  <script>

    /* =========================================================
       EURONEWS LIVE
       VERSIONE TV
       AUDIO DISATTIVATO
       ========================================================= */

    const STREAM_URL =
      "https://cdn-euronews.akamaized.net/1/eveds/euronews-it/25085/index.m3u8";

    const video = document.getElementById("video");

    let hls = null;
    let retryTimer = null;
    let started = false;


    /* =========================================================
       IMPOSTAZIONI VIDEO
       ========================================================= */

    video.muted = true;
    video.volume = 0;

    video.autoplay = true;
    video.playsInline = true;

    video.setAttribute("muted", "");
    video.setAttribute("autoplay", "");
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");

    video.controls = false;


    /* =========================================================
       AVVIO VIDEO
       ========================================================= */

    function playVideo() {

      video.muted = true;
      video.volume = 0;

      const promise = video.play();

      if (promise !== undefined) {

        promise
          .then(() => {

            started = true;

            console.log(
              "EuroNews: video avviato"
            );

          })
          .catch(() => {

            console.log(
              "EuroNews: autoplay in attesa"
            );

          });

      }
    }


    /* =========================================================
       RESET HLS
       ========================================================= */

    function destroyHLS() {

      if (hls) {

        try {
          hls.destroy();
        } catch (e) {}

        hls = null;
      }
    }


    /* =========================================================
       RICONNESSIONE
       ========================================================= */

    function reconnect() {

      if (retryTimer) {
        return;
      }

      console.log(
        "EuroNews: riconnessione..."
      );

      retryTimer = setTimeout(() => {

        retryTimer = null;

        destroyHLS();

        startStream();

      }, 3000);
    }


    /* =========================================================
       HLS.JS
       ========================================================= */

    function startHLS() {

      destroyHLS();

      hls = new Hls({

        /* Avvio automatico della qualità */
        startLevel: -1,

        /* Adatta la qualità al player */
        capLevelToPlayerSize: true,

        /* Buffer contenuto */
        maxBufferLength: 10,
        maxMaxBufferLength: 20,

        /* Cronologia limitata */
        backBufferLength: 15,

        /* Piccoli buchi nel buffer */
        maxBufferHole: 0.5,

        /* Worker */
        enableWorker: true,

        /* Retry */
        fragLoadingMaxRetry: 6,
        manifestLoadingMaxRetry: 6,
        levelLoadingMaxRetry: 6,

        fragLoadingRetryDelay: 1000,
        manifestLoadingRetryDelay: 1000,
        levelLoadingRetryDelay: 1000,

        /* Timeout */
        fragLoadingTimeOut: 10000,
        manifestLoadingTimeOut: 10000,
        levelLoadingTimeOut: 10000
      });


      hls.attachMedia(video);


      /* =====================================================
         PLAYER COLLEGATO
         ===================================================== */

      hls.on(
        Hls.Events.MEDIA_ATTACHED,
        function () {

          console.log(
            "EuroNews: player collegato"
          );

          hls.loadSource(
            STREAM_URL
          );

        }
      );


      /* =====================================================
         MANIFEST CARICATO
         ===================================================== */

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          console.log(
            "EuroNews: stream disponibile"
          );

          playVideo();

        }
      );


      /* =====================================================
         GESTIONE ERRORI HLS
         ===================================================== */

      hls.on(
        Hls.Events.ERROR,
        function (event, data) {

          console.log(
            "HLS error:",
            data.type,
            data.details
          );

          if (!data.fatal) {
            return;
          }


          switch (data.type) {

            case Hls.ErrorTypes.NETWORK_ERROR:

              console.log(
                "EuroNews: errore rete"
              );

              try {

                hls.startLoad();

              } catch (e) {

                reconnect();

              }

              break;


            case Hls.ErrorTypes.MEDIA_ERROR:

              console.log(
                "EuroNews: errore media"
              );

              try {

                hls.recoverMediaError();

              } catch (e) {

                reconnect();

              }

              break;


            default:

              console.log(
                "EuroNews: riavvio player"
              );

              reconnect();

              break;
          }

        }
      );

    }


    /* =========================================================
       AVVIO STREAM
       ========================================================= */

    function startStream() {

      destroyHLS();


      /* -------------------------------------------------------
         HLS NATIVO
         ------------------------------------------------------- */

      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        console.log(
          "EuroNews: HLS nativo"
        );

        video.src = STREAM_URL;

        video.addEventListener(
          "loadedmetadata",
          function nativePlay() {

            playVideo();

            video.removeEventListener(
              "loadedmetadata",
              nativePlay
            );

          }
        );

        return;
      }


      /* -------------------------------------------------------
         HLS.JS
         ------------------------------------------------------- */

      if (
        window.Hls &&
        Hls.isSupported()
      ) {

        console.log(
          "EuroNews: HLS.js"
        );

        startHLS();

        return;
      }


      /* -------------------------------------------------------
         NESSUN SUPPORTO
         ------------------------------------------------------- */

      console.log(
        "EuroNews: HLS non supportato"
      );

      reconnect();

    }


    /* =========================================================
       STREAM BLOCCATO
       ========================================================= */

    video.addEventListener(
      "stalled",
      function () {

        console.log(
          "EuroNews: stream stalled"
        );

        setTimeout(() => {

          if (
            video.paused ||
            video.readyState < 3
          ) {

            reconnect();

          }

        }, 5000);

      }
    );


    /* =========================================================
       STREAM TERMINATO
       ========================================================= */

    video.addEventListener(
      "ended",
      function () {

        console.log(
          "EuroNews: stream terminato"
        );

        reconnect();

      }
    );


    /* =========================================================
       ERRORE VIDEO
       ========================================================= */

    video.addEventListener(
      "error",
      function () {

        console.log(
          "EuroNews: errore video"
        );

        reconnect();

      }
    );


    /* =========================================================
       CONTROLLO PERIODICO
       ========================================================= */

    setInterval(
      function () {

        if (!video) {
          return;
        }

        /*
         * Audio sempre disattivato
         */
        video.muted = true;
        video.volume = 0;

        /*
         * Se il video è pronto ma fermo,
         * prova a ripartire.
         */
        if (
          video.paused &&
          video.readyState >= 2
        ) {

          playVideo();

        }

      },
      5000
    );


    /* =========================================================
       AVVIO
       ========================================================= */

    startStream();

  </script>

</body>
</html>
