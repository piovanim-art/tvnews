<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TVNews - Euronews Italia Live</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contenitore 16:9 */
        #player {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-width: 100vw;
            max-height: 100vh;
            background: #000;
            overflow: hidden;
        }

        /* Se lo schermo è più alto rispetto al 16:9 */
        @media (min-aspect-ratio: 16/9) {
            #player {
                width: 177.77777778vh;
                height: 100vh;
            }
        }

        video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;
            background: #000;
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: white;
            font-family: Arial, sans-serif;
            font-size: 22px;

            text-align: center;

            background: rgba(0, 0, 0, 0.75);

            padding: 15px 25px;
            border-radius: 8px;

            z-index: 10;

            display: none;
        }
    </style>
</head>

<body>

    <div id="player">

        <video
            id="video"
            autoplay
            muted
            playsinline
            preload="auto">
        </video>

        <div id="status">
            Connessione a Euronews...
        </div>

    </div>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>

        const video = document.getElementById("video");
        const status = document.getElementById("status");

        /*
         * STREAM EURONEWS ITALIA
         */
        const STREAM_URL =
            "https://cdn-euronews.akamaized.net/live/hls/euronews-it/25085/index.m3u8";


        /*
         * MOSTRA STATO
         */
        function showStatus(text) {
            status.textContent = text;
            status.style.display = "block";
        }


        /*
         * NASCONDE STATO
         */
        function hideStatus() {
            status.style.display = "none";
        }


        /*
         * AVVIO STREAM
         */
        function startStream() {

            showStatus("Connessione a Euronews...");


            /*
             * BROWSER CON SUPPORTO HLS NATIVO
             */
            if (video.canPlayType("application/vnd.apple.mpegurl")) {

                video.src = STREAM_URL;

                video.addEventListener(
                    "loadedmetadata",
                    function () {

                        hideStatus();

                        video.play().catch(function () {
                            console.log("Autoplay bloccato");
                        });

                    },
                    { once: true }
                );


                video.addEventListener(
                    "error",
                    function () {

                        showStatus("Riconnessione...");

                        setTimeout(function () {
                            video.load();
                            video.play().catch(function () {});
                        }, 3000);

                    }
                );

            }


            /*
             * BROWSER CHE NECESSITA DI HLS.JS
             */
            else if (Hls.isSupported()) {

                const hls = new Hls({

                    liveSyncDurationCount: 3,

                    liveMaxLatencyDurationCount: 6,

                    enableWorker: true,

                    lowLatencyMode: true,

                    backBufferLength: 30

                });


                /*
                 * CARICA STREAM
                 */
                hls.loadSource(STREAM_URL);


                /*
                 * COLLEGA HLS AL VIDEO
                 */
                hls.attachMedia(video);


                /*
                 * STREAM PRONTO
                 */
                hls.on(
                    Hls.Events.MANIFEST_PARSED,
                    function () {

                        hideStatus();

                        video.play().catch(function () {
                            console.log("Autoplay bloccato");
                        });

                    }
                );


                /*
                 * ERRORE HLS
                 */
                hls.on(
                    Hls.Events.ERROR,
                    function (event, data) {

                        console.log("HLS error:", data);


                        if (data.fatal) {

                            switch (data.type) {

                                /*
                                 * ERRORE DI RETE
                                 */
                                case Hls.ErrorTypes.NETWORK_ERROR:

                                    showStatus("Riconnessione...");

                                    setTimeout(function () {

                                        hls.startLoad();

                                    }, 3000);

                                    break;


                                /*
                                 * ERRORE MEDIA
                                 */
                                case Hls.ErrorTypes.MEDIA_ERROR:

                                    hls.recoverMediaError();

                                    break;


                                /*
                                 * ERRORE FATALE
                                 */
                                default:

                                    hls.destroy();

                                    setTimeout(function () {

                                        startStream();

                                    }, 5000);

                                    break;
                            }
                        }
                    }
                );


                /*
                 * VIDEO IN RIPRODUZIONE
                 */
                video.addEventListener(
                    "playing",
                    function () {

                        hideStatus();

                    }
                );


                /*
                 * VIDEO BLOCCATO
                 */
                video.addEventListener(
                    "stalled",
                    function () {

                        showStatus("Riconnessione...");

                    }
                );

            }


            /*
             * HLS NON SUPPORTATO
             */
            else {

                showStatus(
                    "Questo dispositivo non supporta lo streaming HLS."
                );

            }
        }


        /*
         * AVVIO AUTOMATICO
         */
        startStream();

    </script>

</body>
</html>
