<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EuroNews Live</title>

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }

    iframe {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      margin: 0;
      padding: 0;

      background: #000;
    }

  </style>

</head>

<body>

  <iframe
    src="https://it.euronews.com/live"
    allow="autoplay; fullscreen"
    allowfullscreen
    frameborder="0"
    scrolling="no">
  </iframe>

</body>

</html>
