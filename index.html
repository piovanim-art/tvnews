<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>EuroNews Live</title>

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }


    /* =========================
       VIDEO
       ========================= */

    #video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      background: #000;

      object-fit: contain;

      border: 0;
      outline: 0;
    }


    /* =========================
       SPLASH VIRGIN ACTIVE
       ========================= */

    #splash {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      background: #000;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 9999;

      opacity: 1;

      margin: 0;
      padding: 0;
    }


    /* =========================
       LOGO VIRGIN ACTIVE
       DIMENSIONE FISSA
       ========================= */

    #logo {
      display: block;

      width: 450px;
      height: auto;

      min-width: 450px;
      max-width: none;

      object-fit: contain;

      margin: 0;
      padding: 0;

      transform: none;
      animation: none;

      opacity: 1;
    }


    /* =========================
       NASCONDE SPLASH
       ========================= */

    #splash.hidden {
      display: none;
    }

  </style>
</head>


<body>


  <!-- =========================
       SPLASH VIRGIN ACTIVE
       ========================= -->

  <div id="splash">

    <img
      id="logo"
      src="logo.png"
      alt="Virgin Active"
    >

  </div>


  <!-- =========================
       VIDEO EURO NEWS
       ========================= -->

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate nofullscreen"
  ></video>


  <!-- =========================
       HLS.JS
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>


  <script>

    const STREAM_URL =
      "https://cdn-euronews.akamaized.net/live/eds/euronews-it/25085/index.m3u8";

    const video = document.getElementById("video");
    const splash = document.getElementById("splash");

    let hls = null;
    let retryTimer = null;


    /* =========================
       AUDIO OFF
       ========================= */

    video.muted = true;
    video.volume = 0;

    video.autoplay = true;
    video.playsInline = true;

    video.setAttribute("muted", "");
    video.setAttribute("autoplay", "");
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");

    video.controls = false;


    /* =========================
       LOGO FISSO PER 8 SECONDI
       ========================= */

    setTimeout(function () {

      splash.classList.add("hidden");

    }, 8000);


    /* =========================
       PLAY VIDEO
       ========================= */

    function playVideo() {

      video.muted = true;
      video.volume = 0;

      const promise = video.play();

      if (promise !== undefined) {

        promise
          .then(function () {

            console.log("EuroNews: video avviato");

          })
          .catch(function () {

            console.log("EuroNews: autoplay in attesa");

          });

      }

    }


    /* =========================
       DISTRUGGE HLS
       ========================= */

    function destroyHLS() {

      if (hls) {

        try {
          hls.destroy();
        } catch (e) {}

        hls = null;
      }

    }


    /* =========================
       RICONNESSIONE
       ========================= */

    function reconnect() {

      if (retryTimer) {
        return;
      }

      console.log("EuroNews: riconnessione...");

      retryTimer = setTimeout(function () {

        retryTimer = null;

        destroyHLS();

        startStream();

      }, 3000);

    }


    /* =========================
       HLS.JS
       ========================= */

    function startHLS() {

      destroyHLS();

      hls = new Hls({

        startLevel: -1,

        capLevelToPlayerSize: true,

        maxBufferLength: 10,
        maxMaxBufferLength: 20,

        backBufferLength: 15,

        maxBufferHole: 0.5,

        enableWorker: true,

        fragLoadingMaxRetry: 6,
        manifestLoadingMaxRetry: 6,
        levelLoadingMaxRetry: 6,

        fragLoadingRetryDelay: 1000,
        manifestLoadingRetryDelay: 1000,
        levelLoadingRetryDelay: 1000,

        fragLoadingTimeOut: 10000,
        manifestLoadingTimeOut: 10000,
        levelLoadingTimeOut: 10000

      });


      hls.attachMedia(video);


      hls.on(
        Hls.Events.MEDIA_ATTACHED,
        function () {

          console.log("EuroNews: player collegato");

          hls.loadSource(STREAM_URL);

        }
      );


      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          console.log("EuroNews: stream disponibile");

          playVideo();

        }
      );


      hls.on(
        Hls.Events.ERROR,
        function (event, data) {

          console.log(
            "HLS error:",
            data.type,
            data.details
          );


          if (!data.fatal) {
            return;
          }


          switch (data.type) {

            case Hls.ErrorTypes.NETWORK_ERROR:

              try {

                hls.startLoad();

              } catch (e) {

                reconnect();

              }

              break;


            case Hls.ErrorTypes.MEDIA_ERROR:

              try {

                hls.recoverMediaError();

              } catch (e) {

                reconnect();

              }

              break;


            default:

              reconnect();

              break;

          }

        }
      );

    }


    /* =========================
       AVVIO STREAM
       ========================= */

    function startStream() {

      destroyHLS();


      /* HLS NATIVO */

      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        console.log("EuroNews: HLS nativo");

        video.src = STREAM_URL;


        video.addEventListener(
          "loadedmetadata",
          function nativePlay() {

            playVideo();

            video.removeEventListener(
              "loadedmetadata",
              nativePlay
            );

          }
        );

        return;
      }


      /* HLS.JS */

      if (window.Hls && Hls.isSupported()) {

        console.log("EuroNews: HLS.js");

        startHLS();

        return;
      }


      console.log("EuroNews: HLS non supportato");

      reconnect();

    }


    /* =========================
       STREAM BLOCCATO
       ========================= */

    video.addEventListener(
      "stalled",
      function () {

        setTimeout(function () {

          if (
            video.paused ||
            video.readyState < 3
          ) {

            reconnect();

          }

        }, 5000);

      }
    );


    /* =========================
       STREAM TERMINATO
       ========================= */

    video.addEventListener(
      "ended",
      function () {

        reconnect();

      }
    );


    /* =========================
       ERRORE VIDEO
       ========================= */

    video.addEventListener(
      "error",
      function () {

        reconnect();

      }
    );


    /* =========================
       CONTROLLO AUTOMATICO
       ========================= */

    setInterval(function () {

      video.muted = true;
      video.volume = 0;

      if (
        video.paused &&
        video.readyState >= 2
      ) {

        playVideo();

      }

    }, 5000);


    /* =========================
       AVVIO
       ========================= */

    startStream();

  </script>

</body>
</html>
