<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>EuroNews Live</title>

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }


    /* =========================
       VIDEO
       ========================= */

    #video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      background: #000;

      object-fit: contain;

      border: 0;
      outline: 0;

      opacity: 0;

      transition: none;
    }


    /* =========================
       SCHERMATA LOGO
       ========================= */

    #logoScreen {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: #000;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 9999;

      opacity: 1;

      transition: none;
    }


    /*

       IMPORTANTE:
       nessuna animazione,
       nessun transform,
       nessun effetto scale.

       Il browser utilizza direttamente
       le dimensioni dell'immagine.

    */

    #logo {

      display: block;

      width: auto;
      height: auto;

      max-width: none;
      max-height: none;

      margin: 0;
      padding: 0;

      transform: none;

      animation: none;

      transition: none;
    }

  </style>
</head>


<body>


  <!-- =========================
       LOGO VIRGIN ACTIVE
       ========================= -->

  <div id="logoScreen">

    <img
      id="logo"
      src="https://raw.githubusercontent.com/piovanim-art/tvnews/main/logo.png"
      alt="Virgin Active"
    >

  </div>


  <!-- =========================
       VIDEO EURO NEWS
       ========================= -->

  <video
    id="video"

    autoplay
    muted
    playsinline
    webkit-playsinline

    preload="auto"

    disablepictureinpicture

    controlslist="nodownload noplaybackrate nofullscreen"
  ></video>


  <!-- =========================
       HLS.JS
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>


  <script>

    /* =========================
       STREAM EURO NEWS
       ========================= */

    const STREAM_URL =
      "https://cdn-euronews.akamaized.net/live/eds/euronews-it/25085/index.m3u8";


    /* =========================
       ELEMENTI
       ========================= */

    const video =
      document.getElementById("video");

    const logoScreen =
      document.getElementById("logoScreen");


    /* =========================
       VARIABILI
       ========================= */

    let hls = null;

    let retryTimer = null;

    let streamStarted = false;

    let logoMinimumTimePassed = false;


    /* =========================
       AUDIO OFF
       ========================= */

    video.muted = true;

    video.volume = 0;

    video.autoplay = true;

    video.playsInline = true;

    video.setAttribute("muted", "");

    video.setAttribute("autoplay", "");

    video.setAttribute("playsinline", "");

    video.setAttribute("webkit-playsinline", "");

    video.controls = false;


    /* =========================
       TIMER LOGO
       ========================= */

    setTimeout(function () {

      logoMinimumTimePassed = true;

      showVideoIfReady();

    }, 5000);


    /* =========================
       MOSTRA VIDEO
       SOLO QUANDO È PRONTO
       ========================= */

    function showVideoIfReady() {

      if (
        logoMinimumTimePassed &&
        streamStarted
      ) {

        logoScreen.style.display = "none";

        video.style.opacity = "1";

      }

    }


    /* =========================
       PLAY VIDEO
       ========================= */

    function playVideo() {

      video.muted = true;

      video.volume = 0;

      const promise = video.play();


      if (promise !== undefined) {

        promise

          .then(function () {

            console.log(
              "EuroNews: video avviato"
            );

            streamStarted = true;

            showVideoIfReady();

          })

          .catch(function () {

            console.log(
              "EuroNews: autoplay in attesa"
            );

          });

      }

    }


    /* =========================
       DISTRUGGI HLS
       ========================= */

    function destroyHLS() {

      if (hls) {

        try {

          hls.destroy();

        } catch (e) {}

        hls = null;

      }

    }


    /* =========================
       RICONNESSIONE
       ========================= */

    function reconnect() {

      if (retryTimer) {

        return;

      }


      console.log(
        "EuroNews: riconnessione..."
      );


      retryTimer = setTimeout(function () {

        retryTimer = null;

        streamStarted = false;

        video.style.opacity = "0";

        logoScreen.style.display = "flex";

        destroyHLS();

        startStream();

      }, 3000);

    }


    /* =========================
       HLS.JS
       ========================= */

    function startHLS() {

      destroyHLS();


      hls = new Hls({

        startLevel: -1,

        capLevelToPlayerSize: true,

        maxBufferLength: 10,

        maxMaxBufferLength: 20,

        backBufferLength: 15,

        maxBufferHole: 0.5,

        enableWorker: true,

        fragLoadingMaxRetry: 6,

        manifestLoadingMaxRetry: 6,

        levelLoadingMaxRetry: 6,

        fragLoadingRetryDelay: 1000,

        manifestLoadingRetryDelay: 1000,

        levelLoadingRetryDelay: 1000,

        fragLoadingTimeOut: 10000,

        manifestLoadingTimeOut: 10000,

        levelLoadingTimeOut: 10000

      });


      hls.attachMedia(video);


      /* =========================
         MEDIA ATTACHED
         ========================= */

      hls.on(
        Hls.Events.MEDIA_ATTACHED,
        function () {

          console.log(
            "EuroNews: player collegato"
          );

          hls.loadSource(
            STREAM_URL
          );

        }
      );


      /* =========================
         MANIFEST
         ========================= */

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          console.log(
            "EuroNews: stream disponibile"
          );

          playVideo();

        }
      );


      /* =========================
         ERRORI HLS
         ========================= */

      hls.on(
        Hls.Events.ERROR,
        function (event, data) {

          console.log(
            "HLS error:",
            data.type,
            data.details
          );


          if (!data.fatal) {

            return;

          }


          switch (data.type) {


            case Hls.ErrorTypes.NETWORK_ERROR:

              console.log(
                "EuroNews: errore rete"
              );

              try {

                hls.startLoad();

              } catch (e) {

                reconnect();

              }

              break;


            case Hls.ErrorTypes.MEDIA_ERROR:

              console.log(
                "EuroNews: errore media"
              );

              try {

                hls.recoverMediaError();

              } catch (e) {

                reconnect();

              }

              break;


            default:

              console.log(
                "EuroNews: riavvio player"
              );

              reconnect();

              break;

          }

        }
      );

    }


    /* =========================
       AVVIO STREAM
       ========================= */

    function startStream() {

      destroyHLS();


      /* =========================
         HLS NATIVO
         ========================= */

      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        console.log(
          "EuroNews: HLS nativo"
        );


        video.src =
          STREAM_URL;


        video.addEventListener(
          "loadedmetadata",
          function nativePlay() {

            playVideo();


            video.removeEventListener(
              "loadedmetadata",
              nativePlay
            );

          }
        );


        return;

      }


      /* =========================
         HLS.JS
         ========================= */

      if (
        window.Hls &&
        Hls.isSupported()
      ) {

        console.log(
          "EuroNews: HLS.js"
        );


        startHLS();


        return;

      }


      console.log(
        "EuroNews: HLS non supportato"
      );


      reconnect();

    }


    /* =========================
       STALLED
       ========================= */

    video.addEventListener(
      "stalled",
      function () {

        console.log(
          "EuroNews: stream stalled"
        );


        setTimeout(function () {

          if (
            video.paused ||
            video.readyState < 3
          ) {

            reconnect();

          }

        }, 5000);

      }
    );


    /* =========================
       ENDED
       ========================= */

    video.addEventListener(
      "ended",
      function () {

        console.log(
          "EuroNews: stream terminato"
        );

        reconnect();

      }
    );


    /* =========================
       ERRORE VIDEO
       ========================= */

    video.addEventListener(
      "error",
      function () {

        console.log(
          "EuroNews: errore video"
        );

        reconnect();

      }
    );


    /* =========================
       CONTROLLO CONTINUO
       ========================= */

    setInterval(function () {

      video.muted = true;

      video.volume = 0;


      if (
        video.paused &&
        video.readyState >= 2
      ) {

        playVideo();

      }

    }, 5000);


    /* =========================
       AVVIO
       ========================= */

    startStream();

  </script>

</body>
</html>
