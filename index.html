<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TV News</title>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video {
      display: block;

      width: 100vw;
      height: 100vh;

      object-fit: contain;

      background: #000;
    }

    #status {
      position: fixed;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: #fff;
      background: rgba(0, 0, 0, 0.75);

      padding: 12px 20px;

      border-radius: 8px;

      font-family: Arial, sans-serif;
      font-size: 18px;

      z-index: 10;
    }
  </style>
</head>

<body>

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
  ></video>

  <div id="status">Caricamento...</div>

  <script>

    const video = document.getElementById("video");
    const status = document.getElementById("status");

    /*
      STREAM EURONEWS ITALIA
    */
    const STREAM_URL =
      "https://cdn-euronews-uk.a-cdn.net/live_uk/euro-news-it/25085/index.m3u8";


    /*
      MOSTRA STATO
    */
    function showStatus(text) {
      status.textContent = text;
      status.style.display = "block";
    }


    /*
      NASCONDE STATO
    */
    function hideStatus() {
      status.style.display = "none";
    }


    /*
      AVVIO VIDEO
    */
    function playVideo() {

      video.muted = true;
      video.volume = 0;

      const promise = video.play();

      if (promise !== undefined) {

        promise
          .then(function () {

            hideStatus();

            console.log("Video avviato automaticamente");

          })
          .catch(function (error) {

            console.log("Autoplay non riuscito:", error);

            /*
              Ritenta dopo 1 secondo
            */
            setTimeout(function () {

              video.muted = true;
              video.play().catch(function () {});

            }, 1000);

          });
      }
    }


    /*
      AVVIO STREAM
    */
    function startStream() {

      showStatus("Caricamento...");


      /*
        SUPPORTO HLS NATIVO
        (Safari / alcuni dispositivi)
      */
      if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = STREAM_URL;

        video.addEventListener(
          "loadedmetadata",
          function () {

            playVideo();

          },
          { once: true }
        );

        video.load();

        return;
      }


      /*
        HLS.JS
      */
      if (typeof Hls !== "undefined" && Hls.isSupported()) {

        const hls = new Hls({

          /*
            PARAMETRI OTTIMIZZATI
            PER STREAM LIVE
          */

          enableWorker: true,

          lowLatencyMode: false,

          liveSyncDurationCount: 3,

          liveMaxLatencyDurationCount: 6,

          maxBufferLength: 20,

          maxMaxBufferLength: 30,

          backBufferLength: 10,

          startLevel: -1

        });


        hls.loadSource(STREAM_URL);

        hls.attachMedia(video);


        /*
          STREAM PRONTO
        */
        hls.on(
          Hls.Events.MANIFEST_PARSED,
          function () {

            console.log("Stream HLS pronto");

            playVideo();

          }
        );


        /*
          ERRORE HLS
        */
        hls.on(
          Hls.Events.ERROR,
          function (event, data) {

            console.log("HLS error:", data);


            if (data.fatal) {

              switch (data.type) {


                /*
                  ERRORE DI RETE
                */
                case Hls.ErrorTypes.NETWORK_ERROR:

                  showStatus("Riconnessione...");

                  setTimeout(function () {

                    hls.startLoad();

                  }, 3000);

                  break;


                /*
                  ERRORE MEDIA
                */
                case Hls.ErrorTypes.MEDIA_ERROR:

                  console.log("Recupero errore media");

                  hls.recoverMediaError();

                  break;


                /*
                  ERRORE IRRECUPERABILE
                */
                default:

                  hls.destroy();

                  setTimeout(function () {

                    startStream();

                  }, 5000);

                  break;
              }

            }

          }
        );


        /*
          VIDEO BLOCCATO
        */
        video.addEventListener(
          "stalled",
          function () {

            console.log("Stream stalled");

            showStatus("Riconnessione...");

          }
        );


        /*
          VIDEO IN RIPRODUZIONE
        */
        video.addEventListener(
          "playing",
          function () {

            console.log("Video in riproduzione");

            hideStatus();

          }
        );


        /*
          ATTESA BUFFER
        */
        video.addEventListener(
          "waiting",
          function () {

            console.log("Buffering...");

          }
        );


        /*
          ERRORE VIDEO
        */
        video.addEventListener(
          "error",
          function () {

            console.log("Errore video");

            showStatus("Riconnessione...");

          }
        );


        return;
      }


      /*
        NESSUN SUPPORTO HLS
      */
      showStatus("Il dispositivo non supporta lo streaming HLS.");

    }


    /*
      AVVIO AUTOMATICO
    */
    startStream();


    /*
      CONTROLLO PERIODICO
      Se il video si ferma, prova
      automaticamente a ripartire.
    */
    setInterval(function () {

      if (
        video.paused &&
        !video.ended
      ) {

        console.log("Video fermo → riavvio");

        video.muted = true;

        video.play().catch(function () {});

      }

    }, 5000);


  </script>

</body>
</html>
