<!DOCTYPE html>
<html lang="it">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>EuroNews Live</title>

  <!-- Connessioni anticipate per velocizzare il caricamento -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdn-euronews.akamaized.net" crossorigin>

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      background: #000;

      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;
    }

    #video {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      background: #000;

      /*
        Mantiene il rapporto 16:9 senza deformare il video.
      */
      object-fit: contain;

      border: 0;
      outline: 0;

      /*
        Evita selezioni/interazioni accidentali
        sul TV / OptiSigns.
      */
      user-select: none;
      -webkit-user-select: none;

      pointer-events: none;
    }

  </style>

</head>


<body>

  <video
    id="video"

    autoplay
    muted
    playsinline
    webkit-playsinline

    preload="auto"

    disablepictureinpicture

    controlslist="nodownload noplaybackrate nofullscreen"

    tabindex="-1"
  ></video>


  <!-- =====================================================
       HLS.JS
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"
  ></script>


  <script>

    /* =========================================================
       EURONEWS LIVE
       OPTIMIZED FOR OPTISIGNS / TV

       AUDIO:
       DISABLED

       AUTOPLAY:
       ENABLED

       PURPOSE:
       Fast loading + stable playback
       ========================================================= */


    /* =========================================================
       STREAM
       ========================================================= */

    const STREAM_URL =
      "https://cdn-euronews.akamaized.net/01/live/euronews-it/25085/index.m3u8";


    /* =========================================================
       VIDEO ELEMENT
       ========================================================= */

    const video = document.getElementById("video");


    /* =========================================================
       VARIABLES
       ========================================================= */

    let hls = null;

    let retryTimer = null;

    let stalledTimer = null;

    let reconnecting = false;


    /* =========================================================
       VIDEO SETTINGS
       ========================================================= */

    video.autoplay = true;

    video.muted = true;

    video.volume = 0;

    video.playsInline = true;

    video.controls = false;


    video.setAttribute("autoplay", "");

    video.setAttribute("muted", "");

    video.setAttribute("playsinline", "");

    video.setAttribute("webkit-playsinline", "");


    /* =========================================================
       PLAY
       ========================================================= */

    function playVideo() {

      /*
        Garantisce sempre audio OFF.
      */

      video.muted = true;

      video.volume = 0;


      const promise = video.play();


      if (promise !== undefined) {

        promise
          .then(() => {

            console.log(
              "EuroNews: riproduzione avviata"
            );

          })
          .catch(() => {

            /*
              Alcuni browser / dispositivi possono
              ritardare l'autoplay.

              Il controllo periodico proverà
              nuovamente automaticamente.
            */

            console.log(
              "EuroNews: autoplay in attesa"
            );

          });

      }

    }


    /* =========================================================
       DISTRUGGI HLS
       ========================================================= */

    function destroyHLS() {

      if (hls) {

        try {
          hls.destroy();
        } catch (e) {}

        hls = null;

      }

    }


    /* =========================================================
       RICONNESSIONE
       ========================================================= */

    function reconnect() {

      /*
        Evita più riconnessioni contemporaneamente.
      */

      if (retryTimer || reconnecting) {
        return;
      }


      reconnecting = true;


      console.log(
        "EuroNews: riconnessione..."
      );


      retryTimer = setTimeout(() => {

        retryTimer = null;

        reconnecting = false;


        /*
          Pulisce eventuale timer di stall.
        */

        if (stalledTimer) {

          clearTimeout(stalledTimer);

          stalledTimer = null;

        }


        destroyHLS();


        startStream();


      }, 3000);

    }


    /* =========================================================
       HLS.JS
       ========================================================= */

    function startHLS() {

      destroyHLS();


      hls = new Hls({

        /*
          Partenza adattiva.
          HLS.js sceglie automaticamente la qualità
          in base alla connessione.
        */

        startLevel: -1,


        /*
          Adatta la qualità alle dimensioni
          effettive del player.
        */

        capLevelToPlayerSize: true,


        /*
          BUFFER

          10 secondi:
          avvio rapido e consumo contenuto.

          20 secondi:
          piccolo margine di sicurezza.
        */

        maxBufferLength: 10,

        maxMaxBufferLength: 20,


        /*
          Mantiene poca cronologia già riprodotta.

          Riduce RAM e lavoro del dispositivo.
        */

        backBufferLength: 10,


        /*
          Tolleranza sui piccoli buchi tra segmenti.
        */

        maxBufferHole: 0.5,


        /*
          Web Worker attivo:
          lascia il lavoro di elaborazione
          fuori dal thread principale quando possibile.
        */

        enableWorker: true,


        /*
          Caricamento automatico.
        */

        autoStartLoad: true,


        /*
          Parte dal punto live corrente.
        */

        startPosition: -1,


        /*
          Evita di iniziare troppo lontano
          dalla diretta.
        */

        liveSyncDurationCount: 3,


        /*
          Recupero errori di rete.
        */

        fragLoadingMaxRetry: 4,

        manifestLoadingMaxRetry: 4,

        levelLoadingMaxRetry: 4,


        fragLoadingRetryDelay: 1000,

        manifestLoadingRetryDelay: 1000,

        levelLoadingRetryDelay: 1000,


        /*
          Timeout.
        */

        fragLoadingTimeOut: 10000,

        manifestLoadingTimeOut: 10000,

        levelLoadingTimeOut: 10000

      });


      /* =====================================================
         COLLEGA PLAYER
         ===================================================== */

      hls.attachMedia(video);


      /* =====================================================
         MEDIA ATTACHED
         ===================================================== */

      hls.on(
        Hls.Events.MEDIA_ATTACHED,
        function () {

          console.log(
            "EuroNews: player collegato"
          );


          /*
            Carica immediatamente lo stream.
          */

          hls.loadSource(STREAM_URL);

        }
      );


      /* =====================================================
         MANIFEST DISPONIBILE
         ===================================================== */

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          console.log(
            "EuroNews: stream disponibile"
          );


          /*
            Avvio immediato.
          */

          playVideo();

        }
      );


      /* =====================================================
         ERRORI HLS
         ===================================================== */

      hls.on(
        Hls.Events.ERROR,
        function (event, data) {

          console.log(
            "HLS:",
            data.type,
            data.details
          );


          /*
            Gli errori non fatali vengono lasciati
            gestire direttamente a HLS.js.

            Questo evita riavvii inutili
            che potrebbero provocare scatti.
          */

          if (!data.fatal) {
            return;
          }


          /* ================================================
             ERRORE RETE
             ================================================ */

          if (
            data.type === Hls.ErrorTypes.NETWORK_ERROR
          ) {

            console.log(
              "EuroNews: errore rete - recupero"
            );


            try {

              hls.startLoad();

            } catch (e) {

              reconnect();

            }


            return;
          }


          /* ================================================
             ERRORE MEDIA
             ================================================ */

          if (
            data.type === Hls.ErrorTypes.MEDIA_ERROR
          ) {

            console.log(
              "EuroNews: errore media - recupero"
            );


            try {

              hls.recoverMediaError();

            } catch (e) {

              reconnect();

            }


            return;
          }


          /* ================================================
             ALTRO ERRORE FATALE
             ================================================ */

          console.log(
            "EuroNews: errore fatale - riavvio"
          );


          reconnect();

        }
      );

    }


    /* =========================================================
       AVVIO STREAM
       ========================================================= */

    function startStream() {

      destroyHLS();


      /* =====================================================
         HLS NATIVO
         ===================================================== */

      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        console.log(
          "EuroNews: HLS nativo"
        );


        video.src = STREAM_URL;


        video.addEventListener(
          "loadedmetadata",
          function nativePlay() {

            playVideo();


            video.removeEventListener(
              "loadedmetadata",
              nativePlay
            );

          }
        );


        return;
      }


      /* =====================================================
         HLS.JS
         ===================================================== */

      if (
        window.Hls &&
        Hls.isSupported()
      ) {

        console.log(
          "EuroNews: HLS.js"
        );


        startHLS();


        return;
      }


      /* =====================================================
         NON SUPPORTATO
         ===================================================== */

      console.log(
        "EuroNews: HLS non supportato"
      );


      reconnect();

    }


    /* =========================================================
       STREAM STALLED
       ========================================================= */

    video.addEventListener(
      "stalled",
      function () {

        console.log(
          "EuroNews: stream stalled"
        );


        /*
          Non riavviamo immediatamente.

          Diamo tempo a HLS.js di recuperare.
        */

        if (stalledTimer) {
          clearTimeout(stalledTimer);
        }


        stalledTimer = setTimeout(
          function () {

            stalledTimer = null;


            /*
              Se è ancora fermo,
              allora riconnettiamo.
            */

            if (
              video.paused ||
              video.readyState < 3
            ) {

              console.log(
                "EuroNews: stall persistente"
              );


              reconnect();

            }

          },
          8000
        );

      }
    );


    /* =========================================================
       STREAM TERMINATO
       ========================================================= */

    video.addEventListener(
      "ended",
      function () {

        console.log(
          "EuroNews: stream terminato"
        );


        reconnect();

      }
    );


    /* =========================================================
       ERRORE VIDEO
       ========================================================= */

    video.addEventListener(
      "error",
      function () {

        console.log(
          "EuroNews: errore video"
        );


        reconnect();

      }
    );


    /* =========================================================
       CONTROLLO PERIODICO
       ========================================================= */

    setInterval(
      function () {

        /*
          Audio sempre OFF.
        */

        video.muted = true;

        video.volume = 0;


        /*
          Se il video è pronto ma fermo,
          prova automaticamente a ripartire.
        */

        if (
          video.paused &&
          video.readyState >= 2
        ) {

          playVideo();

        }

      },
      5000
    );


    /* =========================================================
       AVVIO INIZIALE
       ========================================================= */

    startStream();

  </script>

</body>
</html>
