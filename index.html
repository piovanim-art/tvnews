<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TVNews - Euronews Italia Live</title>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #video {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      background: #000;
    }

    #status {
      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      color: #fff;

      font-family: Arial, sans-serif;
      font-size: 24px;

      text-align: center;

      background: rgba(0, 0, 0, 0.75);

      padding: 20px 30px;

      border-radius: 8px;

      z-index: 100;

      display: block;
    }
  </style>
</head>

<body>

  <video
    id="video"
    autoplay
    muted
    playsinline
    controls="false">
  </video>

  <div id="status">
    Connessione a Euronews...
  </div>


  <script>

    const video = document.getElementById("video");
    const status = document.getElementById("status");

    /*
      STREAM LIVE EURONEWS ITALIA
    */

    const STREAM_URL =
      "https://cdn-euronews.akamaized.net/1/eveds/euronews-it/25085/index.m3u8";


    function showStatus(message) {

      status.textContent = message;
      status.style.display = "block";

    }


    function hideStatus() {

      status.style.display = "none";

    }


    function startStream() {

      /*
        VERIFICA SUPPORTO HLS NATIVO
      */

      if (video.canPlayType("application/vnd.apple.mpegurl")) {

        console.log("HLS nativo supportato");

        video.src = STREAM_URL;

        video.addEventListener(
          "loadedmetadata",
          function () {

            console.log("Stream caricato");

            hideStatus();

            video.play().catch(function (error) {

              console.log(
                "Autoplay bloccato:",
                error
              );

              showStatus(
                "Premere per avviare il video"
              );

            });

          },
          { once: true }
        );


        video.addEventListener(
          "error",
          function () {

            console.log(
              "Errore nello stream HLS"
            );

            showStatus(
              "Riconnessione a Euronews..."
            );

            setTimeout(
              startStream,
              5000
            );

          },
          { once: true }
        );

      }

      /*
        HLS.JS
      */

      else if (Hls.isSupported()) {

        console.log("Utilizzo HLS.js");

        const hls = new Hls({

          liveSyncDurationCount: 3,

          liveMaxLatencyDurationCount: 6,

          enableWorker: true,

          lowLatencyMode: true,

          backBufferLength: 30

        });


        hls.loadSource(STREAM_URL);

        hls.attachMedia(video);


        hls.on(
          Hls.Events.MANIFEST_PARSED,
          function () {

            console.log(
              "Manifest Euronews caricato"
            );

            hideStatus();

            video.play().catch(function (error) {

              console.log(
                "Autoplay bloccato:",
                error
              );

            });

          }
        );


        /*
          ERRORE HLS
        */

        hls.on(
          Hls.Events.ERROR,
          function (
            event,
            data
          ) {

            console.log(
              "Errore HLS:",
              data
            );


            if (
              data.fatal
            ) {

              switch (
                data.type
              ) {

                case Hls.ErrorTypes.NETWORK_ERROR:

                  showStatus(
                    "Riconnessione..."
                  );

                  console.log(
                    "Errore di rete - riavvio"
                  );

                  setTimeout(
                    function () {

                      hls.startLoad();

                    },
                    3000
                  );

                  break;


                case Hls.ErrorTypes.MEDIA_ERROR:

                  console.log(
                    "Errore media - recupero"
                  );

                  hls.recoverMediaError();

                  break;


                default:

                  console.log(
                    "Errore fatale - riavvio"
                  );

                  hls.destroy();

                  setTimeout(
                    startStream,
                    5000
                  );

                  break;

              }

            }

          }
        );


        /*
          VIDEO BLOCCATO
        */

        video.addEventListener(
          "stalled",
          function () {

            showStatus(
              "Riconnessione..."
            );

          }
        );


        /*
          VIDEO RIPARTITO
        */

        video.addEventListener(
          "playing",
          function () {

            console.log(
              "Euronews LIVE"
            );

            hideStatus();

          }
        );

      }

      /*
        DISPOSITIVO NON COMPATIBILE
      */

      else {

        showStatus(
          "Questo dispositivo non supporta il formato HLS."
        );

      }

    }


    /*
      AVVIO
    */

    startStream();


    /*
      TENTATIVO DI AUTOPLAY
      DOPO IL CARICAMENTO
    */

    window.addEventListener(
      "load",
      function () {

        video.play().catch(
          function () {

            console.log(
              "Autoplay non disponibile"
            );

          }
        );

      }
    );


    /*
      SE LA PAGINA RESTA APERTA MOLTO A LUNGO,
      RICONTROLLA LO STREAM OGNI 10 MINUTI
    */

    setInterval(
      function () {

        if (
          video.paused ||
          video.readyState < 3
        ) {

          console.log(
            "Video non attivo - riavvio"
          );

          startStream();

        }

      },
      10 * 60 * 1000
    );

  </script>

</body>
</html>
