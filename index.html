<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>EuroNews Live</title>

<style>
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
}

body {
  position: fixed;
  inset: 0;
}

#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
  object-fit: contain;
  border: 0;
  outline: 0;
}
</style>
</head>

<body>

<video
  id="video"
  autoplay
  muted
  playsinline
  webkit-playsinline
  preload="auto"
  disablepictureinpicture
  controlslist="nodownload noplaybackrate nofullscreen">
</video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

<script>

const STREAM_URL =
"https://cdn-euronews.akamaized.net/01/live/euronews-it/25085/index.m3u8";

const video = document.getElementById("video");

let hls = null;
let retryTimer = null;


/* =========================
   VIDEO
========================= */

video.muted = true;
video.defaultMuted = true;
video.volume = 0;
video.autoplay = true;
video.playsInline = true;

video.setAttribute("muted", "");
video.setAttribute("autoplay", "");
video.setAttribute("playsinline", "");
video.setAttribute("webkit-playsinline", "");

video.controls = false;


/* =========================
   PLAY
========================= */

function playVideo() {

  video.muted = true;
  video.defaultMuted = true;
  video.volume = 0;

  try {

    const p = video.play();

    if (p !== undefined) {

      p.then(() => {

        console.log("EuroNews PLAY OK");

      }).catch(() => {

        console.log("EuroNews autoplay bloccato");

      });

    }

  } catch (e) {

    console.log("EuroNews play error");

  }
}


/* =========================
   DESTROY HLS
========================= */

function destroyHLS() {

  if (hls) {

    try {
      hls.destroy();
    } catch (e) {}

    hls = null;
  }
}


/* =========================
   RECONNECT
========================= */

function reconnect() {

  if (retryTimer) {
    return;
  }

  retryTimer = setTimeout(() => {

    retryTimer = null;

    destroyHLS();

    startStream();

  }, 3000);
}


/* =========================
   HLS.JS
========================= */

function startHLS() {

  destroyHLS();

  hls = new Hls({

    startLevel: -1,

    capLevelToPlayerSize: true,

    maxBufferLength: 10,
    maxMaxBufferLength: 20,

    backBufferLength: 15,

    maxBufferHole: 0.5,

    enableWorker: true,

    fragLoadingMaxRetry: 6,
    manifestLoadingMaxRetry: 6,
    levelLoadingMaxRetry: 6,

    fragLoadingRetryDelay: 1000,
    manifestLoadingRetryDelay: 1000,
    levelLoadingRetryDelay: 1000,

    fragLoadingTimeOut: 10000,
    manifestLoadingTimeOut: 10000,
    levelLoadingTimeOut: 10000

  });


  hls.attachMedia(video);


  hls.on(
    Hls.Events.MEDIA_ATTACHED,
    function () {

      console.log("EuroNews player collegato");

      hls.loadSource(STREAM_URL);

    }
  );


  hls.on(
    Hls.Events.MANIFEST_PARSED,
    function () {

      console.log("EuroNews stream disponibile");

      playVideo();

    }
  );


  /* Quando arriva effettivamente il primo contenuto */

  hls.on(
    Hls.Events.FRAG_BUFFERED,
    function () {

      if (video.paused) {

        playVideo();

      }

    }
  );


  /* =========================
     ERRORI
  ========================= */

  hls.on(
    Hls.Events.ERROR,
    function (event, data) {

      console.log(
        "HLS:",
        data.type,
        data.details
      );

      if (!data.fatal) {
        return;
      }


      switch (data.type) {

        case Hls.ErrorTypes.NETWORK_ERROR:

          try {

            hls.startLoad();

          } catch (e) {

            reconnect();

          }

          break;


        case Hls.ErrorTypes.MEDIA_ERROR:

          try {

            hls.recoverMediaError();

          } catch (e) {

            reconnect();

          }

          break;


        default:

          reconnect();

          break;

      }

    }
  );

}


/* =========================
   START STREAM
========================= */

function startStream() {

  destroyHLS();


  /* HLS NATIVO */

  if (
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    console.log("EuroNews HLS nativo");

    video.src = STREAM_URL;

    video.load();

    video.addEventListener(
      "loadedmetadata",
      function nativePlay() {

        playVideo();

        video.removeEventListener(
          "loadedmetadata",
          nativePlay
        );

      }
    );

    return;
  }


  /* HLS.JS */

  if (
    window.Hls &&
    Hls.isSupported()
  ) {

    console.log("EuroNews HLS.js");

    startHLS();

    return;
  }


  /* NON SUPPORTATO */

  console.log("HLS non supportato");

  reconnect();

}


/* =========================
   VIDEO EVENTS
========================= */

video.addEventListener(
  "canplay",
  function () {

    if (video.paused) {
      playVideo();
    }

  }
);


video.addEventListener(
  "playing",
  function () {

    console.log("EuroNews VIDEO OK");

  }
);


video.addEventListener(
  "pause",
  function () {

    setTimeout(() => {

      if (video.paused) {
        playVideo();
      }

    }, 1000);

  }
);


video.addEventListener(
  "stalled",
  function () {

    setTimeout(() => {

      if (
        video.paused ||
        video.readyState < 3
      ) {

        reconnect();

      }

    }, 5000);

  }
);


video.addEventListener(
  "ended",
  function () {

    reconnect();

  }
);


video.addEventListener(
  "error",
  function () {

    reconnect();

  }
);


/* =========================
   CONTROLLO
========================= */

setInterval(() => {

  video.muted = true;
  video.defaultMuted = true;
  video.volume = 0;

  if (
    video.paused &&
    video.readyState >= 2
  ) {

    playVideo();

  }

}, 5000);


/* =========================
   AVVIO
========================= */

startStream();

</script>

</body>
</html>
