<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>EuroNews Live</title>

<style>

/* =========================================================
   PAGINA
   ========================================================= */

html,
body {
  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  background: #000;

  overflow: hidden;

  transform: none !important;
}


/* =========================================================
   BODY
   ========================================================= */

body {
  position: fixed;

  inset: 0;

  background: #000;
}


/* =========================================================
   VIDEO
   ========================================================= */

#video {

  position: fixed;

  left: 0;
  top: 0;

  width: 100vw;
  height: 100vh;

  margin: 0;
  padding: 0;

  border: 0;
  outline: 0;

  background: #000;

  object-fit: contain;

  display: block;
}


/* =========================================================
   SCHERMATA LOGO
   ========================================================= */

#logoScreen {

  position: fixed;

  left: 0;
  top: 0;

  width: 100vw;
  height: 100vh;

  margin: 0;
  padding: 0;

  background: #000;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 100000;

  opacity: 1;

  visibility: visible;

  transform: none !important;

  zoom: 1 !important;

}


/* =========================================================
   LOGO
   ========================================================= */

#logo {

  display: block;

  width: 520px;
  height: auto;

  min-width: 520px;
  max-width: 520px;

  min-height: auto;
  max-height: none;

  margin: 0;
  padding: 0;

  border: 0;

  object-fit: contain;

  object-position: center;

  transform: none !important;

  transition: none !important;

  animation: none !important;

}


/* =========================================================
   NASCONDE LOGO
   ========================================================= */

#logoScreen.hidden {

  display: none !important;

  visibility: hidden !important;

  opacity: 0 !important;

}


/* =========================================================
   BLOCCA QUALSIASI ANIMAZIONE
   ========================================================= */

#logo,
#logoScreen,
body,
html {

  transition: none !important;

  animation: none !important;

}

</style>

</head>


<body>


<!-- =======================================================
     LOGO VIRGIN ACTIVE
     ======================================================= -->

<div id="logoScreen">

  <img
    id="logo"
    src="logo.png"
    alt="Virgin Active"
  >

</div>


<!-- =======================================================
     VIDEO EURONEWS
     ======================================================= -->

<video
  id="video"

  autoplay
  muted
  playsinline
  webkit-playsinline

  preload="auto"

  disablepictureinpicture

  controlslist="nodownload noplaybackrate nofullscreen"
></video>


<!-- =======================================================
     HLS.JS
     ======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>


<script>

/* =========================================================
   STREAM EURONEWS ITALIA
   ========================================================= */

const STREAM_URL =
  "https://cdn-euronews.akamaized.net/live/eds/euronews-it/25085/index.m3u8";


/* =========================================================
   ELEMENTI
   ========================================================= */

const video =
  document.getElementById("video");

const logoScreen =
  document.getElementById("logoScreen");


/* =========================================================
   VARIABILI
   ========================================================= */

let hls = null;

let retryTimer = null;

let logoTimer = null;


/* =========================================================
   AUDIO
   ========================================================= */

video.muted = true;

video.volume = 0;

video.autoplay = true;

video.playsInline = true;

video.setAttribute("muted", "");

video.setAttribute("autoplay", "");

video.setAttribute("playsinline", "");

video.setAttribute(
  "webkit-playsinline",
  "");

video.controls = false;


/* =========================================================
   LOGO FISSO PER 5 SECONDI
   ========================================================= */

function startLogoTimer() {

  if (logoTimer) {

    clearTimeout(logoTimer);

  }


  logoTimer = setTimeout(function() {

    hideLogo();

  }, 5000);

}


/* =========================================================
   NASCONDE LOGO
   ========================================================= */

function hideLogo() {

  if (!logoScreen) {
    return;
  }

  logoScreen.classList.add("hidden");

}


/* =========================================================
   PLAY VIDEO
   ========================================================= */

function playVideo() {

  video.muted = true;

  video.volume = 0;


  const promise = video.play();


  if (promise !== undefined) {

    promise
      .then(function() {

        console.log(
          "EuroNews: video avviato"
        );

      })
      .catch(function() {

        console.log(
          "EuroNews: autoplay in attesa"
        );

      });

  }

}


/* =========================================================
   RESET HLS
   ========================================================= */

function destroyHLS() {

  if (hls) {

    try {

      hls.destroy();

    } catch (e) {}

    hls = null;

  }

}


/* =========================================================
   RICONNESSIONE
   ========================================================= */

function reconnect() {

  if (retryTimer) {

    return;

  }


  console.log(
    "EuroNews: riconnessione..."
  );


  retryTimer = setTimeout(function() {

    retryTimer = null;

    destroyHLS();

    startStream();

  }, 3000);

}


/* =========================================================
   HLS.JS
   ========================================================= */

function startHLS() {

  destroyHLS();


  hls = new Hls({

    startLevel: -1,

    capLevelToPlayerSize: true,

    maxBufferLength: 10,

    maxMaxBufferLength: 20,

    backBufferLength: 15,

    maxBufferHole: 0.5,

    enableWorker: true,

    fragLoadingMaxRetry: 6,

    manifestLoadingMaxRetry: 6,

    levelLoadingMaxRetry: 6,

    fragLoadingRetryDelay: 1000,

    manifestLoadingRetryDelay: 1000,

    levelLoadingRetryDelay: 1000,

    fragLoadingTimeOut: 10000,

    manifestLoadingTimeOut: 10000,

    levelLoadingTimeOut: 10000

  });


  hls.attachMedia(video);


  hls.on(
    Hls.Events.MEDIA_ATTACHED,
    function() {

      console.log(
        "EuroNews: player collegato"
      );

      hls.loadSource(
        STREAM_URL
      );

    }
  );


  hls.on(
    Hls.Events.MANIFEST_PARSED,
    function() {

      console.log(
        "EuroNews: stream disponibile"
      );

      playVideo();

    }
  );


  hls.on(
    Hls.Events.ERROR,
    function(event, data) {

      console.log(
        "HLS error:",
        data.type,
        data.details
      );


      if (!data.fatal) {

        return;

      }


      switch (data.type) {


        case Hls.ErrorTypes.NETWORK_ERROR:

          try {

            hls.startLoad();

          } catch (e) {

            reconnect();

          }

          break;


        case Hls.ErrorTypes.MEDIA_ERROR:

          try {

            hls.recoverMediaError();

          } catch (e) {

            reconnect();

          }

          break;


        default:

          reconnect();

          break;

      }

    }
  );

}


/* =========================================================
   AVVIO STREAM
   ========================================================= */

function startStream() {

  destroyHLS();


  /* -------------------------------------------------------
     HLS NATIVO
     ------------------------------------------------------- */

  if (
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    console.log(
      "EuroNews: HLS nativo"
    );


    video.src = STREAM_URL;


    video.addEventListener(
      "loadedmetadata",
      function nativePlay() {

        playVideo();


        video.removeEventListener(
          "loadedmetadata",
          nativePlay
        );

      }
    );


    return;

  }


  /* -------------------------------------------------------
     HLS.JS
     ------------------------------------------------------- */

  if (
    window.Hls &&
    Hls.isSupported()
  ) {

    console.log(
      "EuroNews: HLS.js"
    );

    startHLS();

    return;

  }


  console.log(
    "EuroNews: HLS non supportato"
  );


  reconnect();

}


/* =========================================================
   VIDEO IN RIPRODUZIONE
   ========================================================= */

video.addEventListener(
  "playing",
  function() {

    console.log(
      "EuroNews: riproduzione attiva"
    );

  }
);


/* =========================================================
   STREAM BLOCCATO
   ========================================================= */

video.addEventListener(
  "stalled",
  function() {

    console.log(
      "EuroNews: stream stalled"
    );


    setTimeout(function() {

      if (
        video.paused ||
        video.readyState < 3
      ) {

        reconnect();

      }

    }, 5000);

  }
);


/* =========================================================
   STREAM TERMINATO
   ========================================================= */

video.addEventListener(
  "ended",
  function() {

    console.log(
      "EuroNews: stream terminato"
    );

    reconnect();

  }
);


/* =========================================================
   ERRORE VIDEO
   ========================================================= */

video.addEventListener(
  "error",
  function() {

    console.log(
      "EuroNews: errore video"
    );

    reconnect();

  }
);


/* =========================================================
   CONTROLLO AUTOMATICO
   ========================================================= */

setInterval(function() {

  video.muted = true;

  video.volume = 0;


  if (
    video.paused &&
    video.readyState >= 2
  ) {

    playVideo();

  }

}, 5000);


/* =========================================================
   AVVIO LOGO
   ========================================================= */

startLogoTimer();


/* =========================================================
   AVVIO STREAM
   ========================================================= */

startStream();

</script>

</body>
</html>
