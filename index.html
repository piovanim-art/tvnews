<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EuroNews Italia</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;
    }

    body {

      display: flex;

      align-items: center;
      justify-content: center;
    }

    #video {

      width: 100vw;
      height: 100vh;

      display: block;

      background: #000;

      /*
        NON DEFORMA IL VIDEO
      */
      object-fit: contain;
    }

    #status {

      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      padding: 12px 20px;

      background: rgba(0,0,0,0.75);

      color: white;

      border-radius: 8px;

      font-family: Arial, sans-serif;

      font-size: 18px;

      z-index: 20;
    }

  </style>

</head>


<body>


  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
  ></video>


  <div id="status">
    Caricamento...
  </div>


  <script>


    /*
    =====================================================
    EURONEWS ITALIA - STREAM LIVE
    =====================================================
    */

    const STREAM_URL =
      "https://cdn-euronews-uk.a-cdn.net/live_uk/euro-news-it/25085/index.m3u8";


    const video =
      document.getElementById("video");

    const status =
      document.getElementById("status");


    let hls = null;

    let reconnectTimer = null;


    /*
    =====================================================
    STATUS
    =====================================================
    */

    function showStatus(text) {

      status.textContent = text;

      status.style.display = "block";
    }


    function hideStatus() {

      status.style.display = "none";
    }


    /*
    =====================================================
    PLAY AUTOMATICO
    =====================================================
    */

    function playVideo() {

      /*
        AUDIO SEMPRE DISATTIVATO
        → permette autoplay
      */

      video.muted = true;

      video.volume = 0;


      const playPromise =
        video.play();


      if (playPromise !== undefined) {

        playPromise
          .then(function () {

            console.log(
              "EuroNews avviato"
            );

            hideStatus();

          })
          .catch(function (error) {

            console.log(
              "Autoplay:",
              error
            );

            /*
              Nuovo tentativo
            */

            setTimeout(
              function () {

                video.muted = true;

                video.play()
                  .catch(function () {});

              },
              1000
            );

          });

      }

    }


    /*
    =====================================================
    AVVIO STREAM
    =====================================================
    */

    function startStream() {


      showStatus(
        "Caricamento EuroNews..."
      );


      /*
      ===================================================
      HLS NATIVO
      ===================================================
      */

      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {


        console.log(
          "Utilizzo HLS nativo"
        );


        video.src =
          STREAM_URL;


        video.addEventListener(
          "loadedmetadata",
          function () {

            playVideo();

          },
          { once: true }
        );


        video.load();


        return;
      }


      /*
      ===================================================
      HLS.JS
      ===================================================
      */

      if (
        typeof Hls !== "undefined" &&
        Hls.isSupported()
      ) {


        console.log(
          "Utilizzo HLS.js"
        );


        hls = new Hls({

          /*
          ------------------------------------------------
          BUFFER PIÙ GRANDE
          ------------------------------------------------
          */

          enableWorker: true,

          lowLatencyMode: false,

          /*
            Manteniamo circa 6 segmenti
            dietro al live
          */

          liveSyncDurationCount: 6,

          liveMaxLatencyDurationCount: 12,

          /*
            BUFFER DI SICUREZZA
          */

          maxBufferLength: 60,

          maxMaxBufferLength: 90,

          backBufferLength: 30,

          /*
            Evita piccoli buchi nel buffer
          */

          maxBufferHole: 1.0,

          /*
            Limita il caricamento
            quando il buffer è pieno
          */

          maxBufferSize: 60 * 1000 * 1000,

          /*
            ADATTAMENTO QUALITA'
          */

          capLevelToPlayerSize: true,

          /*
            Partiamo dalla qualità più bassa
            e poi saliamo automaticamente
          */

          startLevel: 0,

          /*
            ABR più prudente
          */

          abrEwmaFastLive: 5,

          abrEwmaSlowLive: 15,

          abrEwmaDefaultEstimate: 1500000,

          /*
            Caricamento segmenti
          */

          fragLoadingMaxRetry: 6,

          fragLoadingRetryDelay: 1000,

          fragLoadingMaxRetryTimeout: 10000,

          manifestLoadingMaxRetry: 6,

          manifestLoadingRetryDelay: 1000,

          manifestLoadingMaxRetryTimeout: 10000

        });


        /*
        =================================================
        CARICA STREAM
        =================================================
        */

        hls.loadSource(
          STREAM_URL
        );


        /*
        =================================================
        COLLEGA VIDEO
        =================================================
        */

        hls.attachMedia(
          video
        );


        /*
        =================================================
        STREAM PRONTO
        =================================================
        */

        hls.on(
          Hls.Events.MANIFEST_PARSED,
          function () {

            console.log(
              "Manifest EuroNews caricato"
            );

            playVideo();

          }
        );


        /*
        =================================================
        VIDEO BUFFERATO
        =================================================
        */

        hls.on(
          Hls.Events.FRAG_BUFFERED,
          function () {

            if (
              video.readyState >= 3
            ) {

              hideStatus();

            }

          }
        );


        /*
        =================================================
        ERRORI HLS
        =================================================
        */

        hls.on(
          Hls.Events.ERROR,
          function (
            event,
            data
          ) {


            console.log(
              "HLS:",
              data.type,
              data.details
            );


            if (!data.fatal) {

              return;

            }


            /*
            ---------------------------------------------
            ERRORE DI RETE
            ---------------------------------------------
            */

            if (
              data.type ===
              Hls.ErrorTypes.NETWORK_ERROR
            ) {


              console.log(
                "Errore rete → recupero"
              );


              showStatus(
                "Riconnessione..."
              );


              hls.startLoad();


              return;
            }


            /*
            ---------------------------------------------
            ERRORE MEDIA
            ---------------------------------------------
            */

            if (
              data.type ===
              Hls.ErrorTypes.MEDIA_ERROR
            ) {


              console.log(
                "Errore media → recupero"
              );


              hls.recoverMediaError();


              return;
            }


            /*
            ---------------------------------------------
            ERRORE GRAVE
            ---------------------------------------------
            */

            console.log(
              "Riavvio completo stream"
            );


            restartStream();

          }
        );


        /*
        =================================================
        VIDEO IN RIPRODUZIONE
        =================================================
        */

        video.addEventListener(
          "playing",
          function () {

            console.log(
              "▶ EuroNews PLAYING"
            );

            hideStatus();

          }
        );


        /*
        =================================================
        BUFFERING
        =================================================
        */

        video.addEventListener(
          "waiting",
          function () {

            console.log(
              "Buffering..."
            );

          }
        );


        /*
        =================================================
        STALLED
        =================================================
        */

        video.addEventListener(
          "stalled",
          function () {

            console.log(
              "Stream stalled"
            );

          }
        );


        /*
        =================================================
        ERRORE VIDEO
        =================================================
        */

        video.addEventListener(
          "error",
          function () {

            console.log(
              "Errore video"
            );

            restartStream();

          }
        );


        return;

      }


      /*
      ===================================================
      HLS NON SUPPORTATO
      ===================================================
      */

      showStatus(
        "Streaming HLS non supportato"
      );

    }


    /*
    =====================================================
    RIAVVIO STREAM
    =====================================================
    */

    function restartStream() {


      if (reconnectTimer) {

        return;

      }


      showStatus(
        "Riconnessione..."
      );


      reconnectTimer =
        setTimeout(
          function () {


            reconnectTimer =
              null;


            /*
              Distrugge vecchio HLS
            */

            if (hls) {

              try {

                hls.destroy();

              }
              catch (e) {}

              hls = null;

            }


            /*
              Svuota video
            */

            video.pause();

            video.removeAttribute(
              "src"
            );

            video.load();


            /*
              Riavvia
            */

            startStream();


          },
          5000
        );

    }


    /*
    =====================================================
    CONTROLLO AUTOMATICO
    =====================================================
    */

    setInterval(
      function () {


        /*
          Se il video è fermo,
          prova a ripartire
        */

        if (
          video.paused &&
          !video.ended
        ) {


          console.log(
            "Video fermo → PLAY"
          );


          video.muted = true;


          video.play()
            .catch(
              function () {}
            );

        }


      },
      5000
    );


    /*
    =====================================================
    AVVIO
    =====================================================
    */

    startStream();


  </script>


</body>

</html>
