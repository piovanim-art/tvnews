<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>EuroNews Live</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}
</style>

</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto">
</video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

<script>

const video = document.getElementById("video");

const STREAM =
"https://cdn-euronews.akamaized.net/live/eds/euronews-it/25085/index.m3u8";

video.muted = true;
video.volume = 0;

function start(){

    /* HLS nativo */
    if(video.canPlayType("application/vnd.apple.mpegurl")){

        video.src = STREAM;

        video.play().catch(()=>{});

        return;
    }

    /* HLS.js */
    if(window.Hls && Hls.isSupported()){

        const hls = new Hls({

            enableWorker:true,

            capLevelToPlayerSize:true,

            startLevel:-1,

            maxBufferLength:15,

            maxMaxBufferLength:30,

            backBufferLength:10,

            maxBufferHole:1,

            lowLatencyMode:false,

            manifestLoadingMaxRetry:5,

            levelLoadingMaxRetry:5,

            fragLoadingMaxRetry:5,

            manifestLoadingRetryDelay:1000,

            levelLoadingRetryDelay:1000,

            fragLoadingRetryDelay:1000

        });

        hls.loadSource(STREAM);

        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED,()=>{

            video.muted=true;
            video.volume=0;

            video.play().catch(()=>{});

        });

        hls.on(Hls.Events.ERROR,(event,data)=>{

            if(data.fatal){

                setTimeout(()=>{

                    hls.destroy();

                    start();

                },3000);

            }

        });

        return;
    }

    setTimeout(start,3000);
}


/* Se il browser mette in pausa il video */
setInterval(()=>{

    video.muted=true;
    video.volume=0;

    if(video.paused){

        video.play().catch(()=>{});

    }

},5000);


/* Se il flusso termina */
video.addEventListener("ended",()=>{

    setTimeout(start,2000);

});


/* Se il flusso si blocca */
video.addEventListener("stalled",()=>{

    setTimeout(()=>{

        if(video.paused || video.readyState < 3){

            video.play().catch(()=>{});

        }

    },4000);

});


start();

</script>

</body>
</html>
