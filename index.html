<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TVNews - Euronews Italia Live</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

        }

        body {

            display: flex;

            align-items: center;
            justify-content: center;

        }

        /*
         * PLAYER 16:9
         */

        #player {

            position: relative;

            width: 100vw;
            height: 56.25vw;

            max-width: 100vw;
            max-height: 100vh;

            background: #000;

            overflow: hidden;

        }

        /*
         * SCHERMI PIÙ LARGHI DEL 16:9
         */

        @media (min-aspect-ratio: 16/9) {

            #player {

                width: 177.77777778vh;
                height: 100vh;

            }

        }

        /*
         * VIDEO
         */

        #video {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: block;

            background: #000;

            object-fit: contain;

        }

        /*
         * MESSAGGIO
         */

        #status {

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 22px;

            text-align: center;

            background: rgba(0, 0, 0, 0.75);

            padding: 15px 25px;

            border-radius: 8px;

            z-index: 20;

        }

    </style>

</head>


<body>


    <div id="player">


        <video

            id="video"

            autoplay

            muted

            playsinline

            preload="auto">

        </video>


        <div id="status">

            Connessione a Euronews...

        </div>


    </div>


    <!-- HLS.JS -->

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


    <script>


        /*
         * ELEMENTI
         */

        const video =
            document.getElementById("video");

        const status =
            document.getElementById("status");


        /*
         * STREAM EURONEWS ITALIANO
         */

        const STREAM_URL =
            "https://acb6ca89.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmxheHhUVi1ldV9FdXJvbmV3c0l0YWxpYW5vX0hMUw/playlist.m3u8";


        /*
         * MOSTRA STATO
         */

        function showStatus(text) {

            status.textContent = text;

            status.style.display = "block";

        }


        /*
         * NASCONDE STATO
         */

        function hideStatus() {

            status.style.display = "none";

        }


        /*
         * AVVIO VIDEO
         */

        function playVideo() {

            const promise = video.play();

            if (promise !== undefined) {

                promise.catch(function(error) {

                    console.log(
                        "Autoplay:",
                        error
                    );

                });

            }

        }


        /*
         * AVVIO STREAM
         */

        function startStream() {


            showStatus(
                "Connessione a Euronews..."
            );


            /*
             * HLS NATIVO
             */

            if (
                video.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            ) {


                console.log(
                    "HLS nativo"
                );


                video.src =
                    STREAM_URL;


                video.addEventListener(

                    "loadedmetadata",

                    function() {

                        hideStatus();

                        playVideo();

                    },

                    { once: true }

                );


                video.addEventListener(

                    "error",

                    function() {

                        console.log(
                            "Errore video"
                        );

                        reconnectNative();

                    }

                );

            }


            /*
             * HLS.JS
             */

            else if (
                Hls.isSupported()
            ) {


                console.log(
                    "HLS.js"
                );


                const hls =
                    new Hls({

                        /*
                         * AVVIO VELOCE
                         */

                        autoStartLoad: true,

                        /*
                         * Parte vicino
                         * alla diretta
                         */

                        startPosition: -1,

                        liveSyncDurationCount: 3,

                        liveMaxLatencyDurationCount: 8,

                        /*
                         * BUFFER
                         *
                         * 20 secondi sono sufficienti
                         * per avere stabilità senza
                         * rallentare troppo l'avvio.
                         */

                        maxBufferLength: 20,

                        maxMaxBufferLength: 40,

                        backBufferLength: 30,

                        /*
                         * EVITA DI SCARICARE
                         * QUALITÀ INUTILMENTE
                         * SUPERIORI AL PLAYER
                         */

                        capLevelToPlayerSize: true,

                        /*
                         * WORKER
                         */

                        enableWorker: true,

                        /*
                         * LOW LATENCY
                         */

                        lowLatencyMode: true,

                        /*
                         * STIMA INIZIALE
                         *
                         * Partiamo con una stima
                         * abbastanza conservativa
                         * per evitare un avvio lento.
                         */

                        abrEwmaDefaultEstimate: 1500000,

                        /*
                         * RETRY MANIFEST
                         */

                        manifestLoadingMaxRetry: 5,

                        manifestLoadingRetryDelay: 1000,

                        /*
                         * RETRY LIVELLI
                         */

                        levelLoadingMaxRetry: 5,

                        levelLoadingRetryDelay: 1000,

                        /*
                         * RETRY SEGMENTI
                         */

                        fragLoadingMaxRetry: 5,

                        fragLoadingRetryDelay: 1000

                    });


                /*
                 * CARICA STREAM
                 */

                hls.loadSource(
                    STREAM_URL
                );


                /*
                 * COLLEGA VIDEO
                 */

                hls.attachMedia(
                    video
                );


                /*
                 * MANIFEST CARICATO
                 */

                hls.on(

                    Hls.Events.MANIFEST_PARSED,

                    function() {


                        console.log(
                            "Manifest caricato"
                        );


                        hideStatus();


                        playVideo();

                    }

                );


                /*
                 * QUALITÀ DISPONIBILI
                 */

                hls.on(

                    Hls.Events.MANIFEST_PARSED,

                    function() {


                        console.log(
                            "Qualità disponibili:",
                            hls.levels.map(
                                level =>
                                    level.height + "p"
                            )
                        );

                    }

                );


                /*
                 * CAMBIO QUALITÀ
                 */

                hls.on(

                    Hls.Events.LEVEL_SWITCHED,

                    function(
                        event,
                        data
                    ) {


                        const level =
                            hls.levels[data.level];


                        if (level) {

                            console.log(

                                "Qualità:",
                                level.width +
                                "x" +
                                level.height

                            );

                        }

                    }

                );


                /*
                 * VIDEO IN RIPRODUZIONE
                 */

                video.addEventListener(

                    "playing",

                    function() {

                        hideStatus();

                    }

                );


                /*
                 * BUFFERING
                 */

                video.addEventListener(

                    "waiting",

                    function() {

                        console.log(
                            "Buffering..."
                        );

                    }

                );


                /*
                 * STREAM BLOCCATO
                 */

                video.addEventListener(

                    "stalled",

                    function() {

                        console.log(
                            "Stream bloccato"
                        );

                        showStatus(
                            "Riconnessione..."
                        );

                    }

                );


                /*
                 * ERRORI HLS
                 */

                hls.on(

                    Hls.Events.ERROR,

                    function(
                        event,
                        data
                    ) {


                        console.log(
                            "HLS error:",
                            data
                        );


                        /*
                         * ERRORE NON FATALE
                         */

                        if (!data.fatal) {

                            return;

                        }


                        /*
                         * RETE
                         */

                        if (

                            data.type ===
                            Hls.ErrorTypes.NETWORK_ERROR

                        ) {


                            console.log(
                                "Errore rete"
                            );


                            showStatus(
                                "Riconnessione..."
                            );


                            setTimeout(

                                function() {

                                    hls.startLoad();

                                },

                                2000

                            );

                        }


                        /*
                         * MEDIA
                         */

                        else if (

                            data.type ===
                            Hls.ErrorTypes.MEDIA_ERROR

                        ) {


                            console.log(
                                "Recupero errore media"
                            );


                            hls.recoverMediaError();

                        }


                        /*
                         * ERRORE FATALE
                         */

                        else {


                            console.log(
                                "Riavvio HLS"
                            );


                            showStatus(
                                "Riconnessione..."
                            );


                            hls.destroy();


                            setTimeout(

                                function() {

                                    startStream();

                                },

                                3000

                            );

                        }

                    }

                );


            }


            /*
             * HLS NON SUPPORTATO
             */

            else {


                showStatus(

                    "Questo dispositivo non supporta lo streaming HLS."

                );

            }

        }


        /*
         * RICONNESSIONE HLS NATIVO
         */

        function reconnectNative() {


            showStatus(
                "Riconnessione..."
            );


            setTimeout(

                function() {


                    video.pause();

                    video.removeAttribute(
                        "src"
                    );

                    video.load();

                    video.src =
                        STREAM_URL;

                    video.load();

                    playVideo();


                },

                2000

            );

        }


        /*
         * CONTROLLO OGNI 10 SECONDI
         */

        setInterval(

            function() {


                if (
                    video.paused &&
                    video.readyState >= 2
                ) {


                    console.log(
                        "Video fermo - riavvio"
                    );


                    playVideo();

                }


            },

            10000

        );


        /*
         * AVVIO
         */

        startStream();


    </script>


</body>

</html>
