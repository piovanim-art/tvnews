<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>EuroNews Live</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      object-fit: contain;
      border: 0;
      outline: 0;
    }
  </style>
</head>

<body>

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    controls="false"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate nofullscreen"
  ></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

  <script>

    /* =========================================================
       EURONEWS LIVE - V2
       Ottimizzato per OptiSigns / TV
       Mantiene lo stesso stream che funzionava
       ========================================================= */

    const STREAM_URL =
      "https://cdn-euronews.akamaized.net/01/live/euronews-it/25085/index.m3u8";

    const video = document.getElementById("video");

    let hls = null;
    let retryTimer = null;
    let playTimer = null;


    /* =========================================================
       CONFIGURAZIONE VIDEO
       ========================================================= */

    video.muted = true;
    video.defaultMuted = true;
    video.volume = 0;

    video.autoplay = true;
    video.playsInline = true;

    video.setAttribute("autoplay", "");
    video.setAttribute("muted", "");
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");

    video.controls = false;


    /* =========================================================
       AVVIO VIDEO
       ========================================================= */

    function forcePlay() {

      if (!video) {
        return;
      }

      video.muted = true;
      video.defaultMuted = true;
      video.volume = 0;

      try {

        const promise = video.play();

        if (promise !== undefined) {

          promise
            .then(() => {

              console.log("EuroNews: PLAY OK");

              clearTimeout(playTimer);
              playTimer = null;

            })
            .catch(() => {

              console.log("EuroNews: play in attesa");

              /* Ritenta senza toccare lo stream */
              clearTimeout(playTimer);

              playTimer = setTimeout(() => {

                forcePlay();

              }, 1000);

            });

        }

      } catch (e) {

        console.log("EuroNews: errore play");

        clearTimeout(playTimer);

        playTimer = setTimeout(() => {

          forcePlay();

        }, 1000);

      }
    }


    /* =========================================================
       DISTRUZIONE HLS
       ========================================================= */

    function destroyHLS() {

      if (hls) {

        try {
          hls.destroy();
        } catch (e) {}

        hls = null;
      }

    }


    /* =========================================================
       RICONNESSIONE
       ========================================================= */

    function reconnect() {

      if (retryTimer) {
        return;
      }

      console.log("EuroNews: riconnessione...");

      retryTimer = setTimeout(() => {

        retryTimer = null;

        destroyHLS();

        startStream();

      }, 3000);

    }


    /* =========================================================
       HLS.JS
       ========================================================= */

    function startHLS() {

      destroyHLS();

      hls = new Hls({

        /* Manteniamo la gestione automatica della qualità */
        startLevel: -1,

        /* Adatta la qualità alle dimensioni della TV */
        capLevelToPlayerSize: true,

        /* Buffer contenuto */
        maxBufferLength: 10,
        maxMaxBufferLength: 20,

        /* Cronologia minima */
        backBufferLength: 15,

        /* Tolleranza buffer */
        maxBufferHole: 0.5,

        /* Web Worker */
        enableWorker: true,

        /* Retry */
        fragLoadingMaxRetry: 6,
        manifestLoadingMaxRetry: 6,
        levelLoadingMaxRetry: 6,

        fragLoadingRetryDelay: 1000,
        manifestLoadingRetryDelay: 1000,
        levelLoadingRetryDelay: 1000,

        /* Timeout */
        fragLoadingTimeOut: 10000,
        manifestLoadingTimeOut: 10000,
        levelLoadingTimeOut: 10000
      });


      /* =====================================================
         COLLEGAMENTO PLAYER
         ===================================================== */

      hls.attachMedia(video);


      hls.on(Hls.Events.MEDIA_ATTACHED, function () {

        console.log("EuroNews: player collegato");

        hls.loadSource(STREAM_URL);

      });


      /* =====================================================
         STREAM PRONTO
         ===================================================== */

      hls.on(Hls.Events.MANIFEST_PARSED, function () {

        console.log("EuroNews: stream disponibile");

        forcePlay();

      });


      hls.on(Hls.Events.FRAG_BUFFERED, function () {

        /*
         * Quando il primo contenuto è realmente nel buffer,
         * proviamo nuovamente ad avviare il video.
         */

        if (video.paused) {

          forcePlay();

        }

      });


      /* =====================================================
         ERRORI HLS
         ===================================================== */

      hls.on(Hls.Events.ERROR, function (event, data) {

        console.log(
          "HLS error:",
          data.type,
          data.details,
          data.fatal
        );

        if (!data.fatal) {
          return;
        }


        switch (data.type) {

          case Hls.ErrorTypes.NETWORK_ERROR:

            console.log("EuroNews: errore rete");

            try {

              hls.startLoad();

              forcePlay();

            } catch (e) {

              reconnect();

            }

            break;


          case Hls.ErrorTypes.MEDIA_ERROR:

            console.log("EuroNews: errore media");

            try {

              hls.recoverMediaError();

              forcePlay();

            } catch (e) {

              reconnect();

            }

            break;


          default:

            console.log("EuroNews: riavvio player");

            reconnect();

            break;

        }

      });

    }


    /* =========================================================
       AVVIO STREAM
       ========================================================= */

    function startStream() {

      destroyHLS();


      /* -------------------------------------------------------
         HLS NATIVO
         ------------------------------------------------------- */

      if (video.canPlayType("application/vnd.apple.mpegurl")) {

        console.log("EuroNews: HLS nativo");

        video.src = STREAM_URL;

        video.load();


        video.addEventListener(
          "loadedmetadata",
          function nativeMetadata() {

            console.log("EuroNews: metadata caricati");

            forcePlay();

            video.removeEventListener(
              "loadedmetadata",
              nativeMetadata
            );

          }
        );


        video.addEventListener(
          "canplay",
          function nativeCanPlay() {

            console.log("EuroNews: CAN PLAY");

            forcePlay();

            video.removeEventListener(
              "canplay",
              nativeCanPlay
            );

          }
        );

        return;
      }


      /* -------------------------------------------------------
         HLS.JS
         ------------------------------------------------------- */

      if (window.Hls && Hls.isSupported()) {

        console.log("EuroNews: HLS.js");

        startHLS();

        return;
      }


      /* -------------------------------------------------------
         NESSUN SUPPORTO
         ------------------------------------------------------- */

      console.log("EuroNews: HLS non supportato");

      reconnect();

    }


    /* =========================================================
       STALLED
       ========================================================= */

    video.addEventListener("stalled", function () {

      console.log("EuroNews: stream stalled");

      setTimeout(() => {

        if (video.paused || video.readyState < 3) {

          console.log("EuroNews: tentativo recupero");

          forcePlay();

        }

      }, 3000);

    });


    /* =========================================================
       WAITING
       ========================================================= */

    video.addEventListener("waiting", function () {

      console.log("EuroNews: buffering");

    });


    /* =========================================================
       PLAY
       ========================================================= */

    video.addEventListener("playing", function () {

      console.log("EuroNews: VIDEO IN RIPRODUZIONE");

      clearTimeout(playTimer);

    });


    /* =========================================================
       PAUSA
       ========================================================= */

    video.addEventListener("pause", function () {

      console.log("EuroNews: VIDEO IN PAUSA");

      setTimeout(() => {

        if (video.paused) {

          forcePlay();

        }

      }, 500);

    });


    /* =========================================================
       FINE STREAM
       ========================================================= */

    video.addEventListener("ended", function () {

      console.log("EuroNews: stream terminato");

      reconnect();

    });


    /* =========================================================
       ERRORE VIDEO
       ========================================================= */

    video.addEventListener("error", function () {

      console.log("EuroNews: errore video");

      reconnect();

    });


    /* =========================================================
       CONTROLLO PERIODICO
       ========================================================= */

    setInterval(function () {

      if (!video) {
        return;
      }

      /* Audio sempre spento */
      video.muted = true;
      video.defaultMuted = true;
      video.volume = 0;

      /*
       * Se il video è pronto ma fermo,
       * proviamo nuovamente a farlo partire.
       */

      if (
        video.paused &&
        video.readyState >= 2
      ) {

        console.log("EuroNews: autoplay retry");

        forcePlay();

      }

    }, 3000);


    /* =========================================================
       AVVIO INIZIALE
       ========================================================= */

    startStream();

  </script>

</body>
</html>
