<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>TVNews - Euronews Italia Live</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            position: relative;
        }

        #video {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            border: 0;

            background: #000;

            object-fit: cover;
            object-position: center center;

            display: block;
        }

        #status {
            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 100;

            color: #fff;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 20px;
            font-weight: bold;

            text-align: center;

            background: rgba(0, 0, 0, 0.65);

            padding: 18px 28px;

            border-radius: 8px;

            display: block;
        }

        #status.hidden {
            display: none;
        }
    </style>
</head>

<body>

    <video
        id="video"
        autoplay
        muted
        playsinline
        webkit-playsinline
        controls="false">
    </video>

    <div id="status">
        Connessione a Euronews...
    </div>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>

        const video = document.getElementById("video");
        const status = document.getElementById("status");

        /*
         * STREAM EURONEWS
         */
        const STREAM_URL =
            "https://cdn-euronews.akamaized.net/live/eds/euronews-it/2585/index.m3u8";


        /*
         * MOSTRA STATO
         */
        function showStatus(text) {
            status.textContent = text;
            status.classList.remove("hidden");
        }


        /*
         * NASCONDI STATO
         */
        function hideStatus() {
            status.classList.add("hidden");
        }


        /*
         * AVVIO STREAM
         */
        function startStream() {

            showStatus("Connessione a Euronews...");


            /*
             * HLS NATIVO
             *
             * Safari / alcuni dispositivi
             */
            if (video.canPlayType("application/vnd.apple.mpegurl")) {

                video.src = STREAM_URL;

                video.addEventListener("loadedmetadata", function () {

                    video.play()
                        .then(function () {

                            hideStatus();

                        })
                        .catch(function () {

                            showStatus("Avvio del video...");

                        });

                }, { once: true });


                video.addEventListener("error", function () {

                    showStatus("Riconnessione...");

                    setTimeout(function () {
                        video.load();
                        video.play().catch(() => {});
                    }, 3000);

                });

            }


            /*
             * HLS.JS
             *
             * Chrome / Edge / Android / OptiSigns
             */
            else if (Hls.isSupported()) {

                const hls = new Hls({

                    /*
                     * Buffer piccolo per mantenere
                     * il live il più possibile aggiornato
                     */
                    liveSyncDurationCount: 3,

                    liveMaxLatencyDurationCount: 6,

                    enableWorker: true,

                    lowLatencyMode: true,

                    backBufferLength: 30,

                    maxBufferLength: 10,

                    maxMaxBufferLength: 20

                });


                /*
                 * CARICA STREAM
                 */
                hls.loadSource(STREAM_URL);


                /*
                 * COLLEGA HLS AL VIDEO
                 */
                hls.attachMedia(video);


                /*
                 * MANIFEST CARICATO
                 */
                hls.on(Hls.Events.MANIFEST_PARSED, function () {

                    video.play()
                        .then(function () {

                            hideStatus();

                        })
                        .catch(function () {

                            showStatus("Avvio del video...");

                        });

                });


                /*
                 * ERRORI HLS
                 */
                hls.on(Hls.Events.ERROR, function (event, data) {

                    console.log("HLS error:", data);


                    /*
                     * Errore recuperabile
                     */
                    if (data.fatal) {

                        switch (data.type) {

                            /*
                             * ERRORE DI RETE
                             */
                            case Hls.ErrorTypes.NETWORK_ERROR:

                                showStatus("Riconnessione...");

                                setTimeout(function () {

                                    hls.startLoad();

                                }, 3000);

                                break;


                            /*
                             * ERRORE MEDIA
                             */
                            case Hls.ErrorTypes.MEDIA_ERROR:

                                console.log("Tentativo di recupero media...");

                                hls.recoverMediaError();

                                break;


                            /*
                             * ALTRO ERRORE
                             */
                            default:

                                showStatus("Riconnessione...");

                                hls.destroy();

                                setTimeout(function () {

                                    startStream();

                                }, 5000);

                                break;
                        }

                    }

                });


                /*
                 * VIDEO IN ATTESA
                 */
                video.addEventListener("waiting", function () {

                    showStatus("Caricamento...");

                });


                /*
                 * VIDEO IN RIPRODUZIONE
                 */
                video.addEventListener("playing", function () {

                    hideStatus();

                });


                /*
                 * VIDEO BLOCCATO
                 */
                video.addEventListener("stalled", function () {

                    showStatus("Riconnessione...");

                });

            }


            /*
             * DISPOSITIVO NON COMPATIBILE
             */
            else {

                showStatus(
                    "Questo dispositivo non supporta lo streaming HLS."
                );

            }

        }


        /*
         * AVVIA
         */
        startStream();


        /*
         * SE IL VIDEO FINISCE / SI BLOCCA
         */
        video.addEventListener("ended", function () {

            showStatus("Riconnessione...");

            setTimeout(function () {

                startStream();

            }, 3000);

        });


        /*
         * TENTATIVO DI RIPRESA AUTOMATICA
         */
        document.addEventListener("visibilitychange", function () {

            if (!document.hidden) {

                video.play().catch(() => {});

            }

        });

    </script>

</body>

</html>
